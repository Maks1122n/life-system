    </div>
  </div>`;
}


/* ---------- уровни: месяц, год, прогресс ---------- */
const MNOM=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const monthOf=k=>String(k).slice(0,7);
const mDays=mk=>{const [y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate()};
const addMonths=(mk,n)=>{const [y,m]=mk.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const monthsBetween=(a,b)=>{const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1)};
const mName=mk=>{const [y,m]=mk.split('-').map(Number);return `${MNOM[m-1]} ${y}`};
const mEnd=mk=>`${mk}-${pad(mDays(mk))}`;
const daysRange=(a,b)=>{const out=[];let k=a;while(k<=b&&out.length<400){out.push(k);k=addDays(k,1)}return out};
function syncHash(){try{history.replaceState(null,'','#'+S.view)}catch(e){}}
function dayPct(k){const s=dayStat(k);return s.has&&s.total?s.done/s.total:0}
function doneOn(k,pid){const d=S.days[k];return !!(d&&d.promises&&d.promises[pid])}
function promiseCount(p,from,to){return daysRange(from,to).filter(k=>doneOn(k,p.id)).length}
/* Неделя: насколько закрыты недельные цели по обещаниям (каждое обещание — до своей нормы). */
function weekHabit(ws){
  const tk=todayKey(),days=daysRange(ws,addDays(ws,6)).filter(k=>k<=tk),prs=cfg().promises||[];let got=0,need=0;
  prs.forEach(p=>{const t=+p.perWeek||7;need+=t;got+=Math.min(days.filter(k=>doneOn(k,p.id)).length,t)});
  return need?got/need:0;
}
function topStat(d){const filled=(d.top||[]).filter(t=>t.task||String(t.t||'').trim());const done=filled.filter(t=>(t.task&&S.tasks[t.task])?!!S.tasks[t.task].done:!!t.d).length;return {filled:filled.length,done}}
function valAt(g,k){const l=[...(g.log||[])].filter(x=>x.d<=k).sort((a,b)=>a.d.localeCompare(b.d));return l.length?+l[l.length-1].v||0:0}
function goalStart(g){const l=[...(g.log||[])].sort((a,b)=>a.d.localeCompare(b.d));const c=g.created||(l[0]&&l[0].d)||todayKey();return l[0]&&l[0].d<c?l[0].d:c}
function idealAt(g,k){const s=goalStart(g),e=g.deadline;if(!e||e<=s)return +g.target||0;return (+g.target||0)*Math.max(0,Math.min(1,diff(s,k)/diff(s,e)))}
function monthStats(mk){
  const tk=todayKey(),sd=startDay(),all=daysRange(mk+'-01',mEnd(mk)),past=all.filter(k=>k<=tk&&k>=sd);
  const full=past.filter(complete).length,avg=past.length?past.reduce((a,k)=>a+dayPct(k),0)/past.length:0;
  const tasks=tasksAll().filter(t=>t.done&&t.doneAt&&monthOf(t.doneAt)===mk).length;
  const ms=[];goalsSorted().forEach(g=>(g.milestones||[]).forEach(m=>{if(m.date&&monthOf(m.date)===mk)ms.push({g,m})}));ms.sort((a,b)=>a.m.date.localeCompare(b.m.date));
  const ens=all.map(k=>S.days[k]&&S.days[k].energy).filter(Boolean);
  return {all,past,full,avg,tasks,ms,msDone:ms.filter(x=>x.m.done).length,energy:ens.length?ens.reduce((a,b)=>a+b,0)/ens.length:null};
}
function krPct(l){l=l||[];return l.length?l.filter(x=>x.d).length/l.length:0}
function yearPct(){const gs=goalsSorted();return gs.length?gs.reduce((a,g)=>a+progress(g),0)/gs.length:0}
const pctTxt=p=>Math.round((p||0)*100)+'%';

/* кольца */
function ring(p,cls,size,sw,txt){
  const r=(size-sw)/2,C=2*Math.PI*r,c=size/2,v=Math.max(0,Math.min(1,p||0));
  return `<svg class="ring2" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true"><circle class="rt" cx="${c}" cy="${c}" r="${r}" stroke-width="${sw}"/>${v>0?`<circle class="rv ${cls}" cx="${c}" cy="${c}" r="${r}" stroke-width="${sw}" stroke-dasharray="${(C*v).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>`:''}${txt!=null?`<text class="rtx" x="${c}" y="${c}" style="font-size:${Math.round(size/(String(txt).length>3?4.6:3.8))}px">${txt}</text>`:''}</svg>`;
}
function rings3(items,size){
  const sw=size*0.1,gap=size*0.04,c=size/2;let out='';
  items.forEach((it,i)=>{const r=c-sw/2-i*(sw+gap),C=2*Math.PI*r,v=Math.max(0,Math.min(1,it.p||0));
    out+=`<circle class="rt" cx="${c}" cy="${c}" r="${r.toFixed(1)}" stroke-width="${sw}"/>`+(v>0?`<circle class="rv ${it.cls}" cx="${c}" cy="${c}" r="${r.toFixed(1)}" stroke-width="${sw}" stroke-dasharray="${(C*v).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>`:'')});
  return `<svg class="ring2" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">${out}</svg>`;
}

/* сигналы: что не работает прямо сейчас */
function signals(){
  const out=[],tk=todayKey(),now=new Date();
  const late=tasksAll().filter(t=>!t.done&&t.due&&t.due<tk);
  if(late.length)out.push({c:'late',t:`${late.length} ${plural(late.length,['задача просрочена','задачи просрочены','задач просрочено'])}. Сделай или перенеси на реальную дату.`,a:'data-view="tasks"',b:'Задачи'});
  goalsSorted().forEach(g=>{
    if(progress(g)>=1)return;
    if(g.kind==='number'&&g.deadline){const exp=idealAt(g,tk),cur=+g.current||0;if(exp>=1&&cur<exp*0.9)out.push({c:'late',t:`«${g.title}»: по графику сейчас нужно ≈ ${fVal(Math.round(exp),g.unit)}, факт ${fVal(cur,g.unit)}.`,a:`data-act="goto-goal" data-id="${esc(g.id)}"`,b:'Цель'})}
    const lm=msSorted(g).filter(m=>!m.done&&m.date&&m.date<tk);
    if(lm.length)out.push({c:'late',t:`«${g.title}»: просрочен этап «${lm[0].title}».`,a:`data-act="goto-goal" data-id="${esc(g.id)}"`,b:'Цель'});
    const near=modeOf(g.sphere)!=='keep'||(g.deadline&&g.deadline<=addDays(tk,45));
    if(near&&!tasksAll().some(t=>t.goal===g.id&&!t.done))out.push({c:'warn',t:`У цели «${g.title}» нет открытых задач: она не двигается.`,a:`data-act="goto-goal" data-id="${esc(g.id)}"`,b:'Добавить'});
  });
  const ws=mondayOf(tk),left=diff(tk,addDays(ws,6))+1;
  (cfg().promises||[]).forEach(p=>{const t=+p.perWeek||7,c=promiseCount(p,ws,tk),remain=left-(doneOn(tk,p.id)?1:0);
    if(c<t&&c+remain<t)out.push({c:'warn',t:`«${p.text}»: ${c} из ${t} за неделю, норму уже не догнать. Разбери причину в обзоре недели.`,a:'data-view="week"',b:'Неделя'})});
  const d=S.days[tk];if(now.getHours()>=10&&!(d&&topStat(d).filled))out.push({c:'warn',t:'Три главные задачи на сегодня не выбраны.',a:'data-act="top-suggest-today"',b:'Подобрать'});
  if(spheresSorted().some(s=>!s.score))out.push({c:'warn',t:'Не все сферы оценены. Без точки отсчёта рост не виден.',a:'data-act="goto-map"',b:'Карта'});
  const mk=monthOf(tk);
  if(!(S.months[mk]&&(S.months[mk].krs||[]).length))out.push({c:'warn',t:`Результаты на ${MNOM[+mk.slice(5)-1].toLowerCase()} не заданы: месяц без ориентира.`,a:`data-act="open-month" data-k="${mk}"`,b:'Месяц'});
  if(!(S.weeks[weekKey(tk)]&&(S.weeks[weekKey(tk)].krs||[]).length))out.push({c:'warn',t:'Результаты недели не заданы.',a:`data-act="open-week" data-k="${tk}"`,b:'Неделя'});
  if(now.getDay()===0&&!(S.weeks[weekKey(tk)]&&S.weeks[weekKey(tk)].wins))out.push({c:'warn',t:'Воскресенье: время обзора недели.',a:'data-view="week"',b:'Обзор'});
  if(diff(tk,mEnd(mk))<=1&&!(S.months[mk]&&S.months[mk].wins))out.push({c:'warn',t:'Конец месяца: подведи итоги и задай результаты на следующий.',a:`data-act="open-month" data-k="${mk}"`,b:'Итоги'});
  const y=addDays(tk,-1);if(S.days[y]&&dayStat(y).total&&!complete(y))out.push({c:'ok',t:'Вчера получилось не всё. Это данные, а не провал: сегодня новая серия.',a:'',b:''});
  if(!out.length)out.push({c:'ok',t:'Всё идёт по плану. Держи ритм.',a:'',b:''});
  return out;
}
function signalsHtml(list){return `<ul class="signals">${list.map(s=>`<li class="sig ${s.c}"><span class="sd"></span><span class="st">${esc(s.t)}</span>${s.b?`<button class="btn sm ghost" type="button" ${s.a}>${s.b}</button>`:'<span></span>'}</li>`).join('')}</ul>`}

/* графики */
function daysChart(end,n){
  const W=340,H=132,L=6,R=6,T=10,B=22,ks=daysRange(addDays(end,-(n-1)),end),bw=(W-L-R)/n,ch=H-T-B,sd=startDay();
  let bars='';const pts=[];
  ks.forEach((k,i)=>{const s=dayStat(k),p=s.has&&s.total?s.done/s.total:0,x=L+i*bw;
    bars+=`<rect class="tr" x="${(x+1).toFixed(1)}" y="${T}" width="${(bw-2).toFixed(1)}" height="${ch}" rx="2"/>`;
    if(p>0)bars+=`<rect class="bv${p>=1?' full':''}" x="${(x+1).toFixed(1)}" y="${(T+ch*(1-p)).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${(ch*p).toFixed(1)}" rx="2"/>`;
    if(k>=sd){const win=ks.slice(Math.max(0,i-6),i+1).filter(x2=>x2>=sd);const a=win.reduce((t,x2)=>t+dayPct(x2),0)/win.length;pts.push(`${(x+bw/2).toFixed(1)},${(T+ch*(1-a)).toFixed(1)}`)}
    if((i%7===0&&i<=n-5)||i===n-1)bars+=`<text class="ax" x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${fShort(k)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Выполнение обещаний за ${n} дней">${bars}${pts.length>1?`<polyline class="avg" points="${pts.join(' ')}"/>`:''}</svg>`;
}
function burnChart(g,compact){
  if(g.kind!=='number')return '';
  const tk=todayKey(),s=goalStart(g),e=g.deadline||addDays(tk,30),tgt=+g.target||0;
  const W=340,H=compact?104:150,L=compact?8:42,R=12,T=10,B=20,cw=W-L-R,ch=H-T-B,span=Math.max(1,diff(s,e));
  const logs=[...(g.log||[])].sort((a,b)=>a.d.localeCompare(b.d));
  const mx=Math.max(tgt,+g.current||0,...logs.map(l=>+l.v||0))||1;
  const X=k=>L+cw*Math.max(0,Math.min(1,diff(s,k)/span)),Y=v=>T+ch*(1-Math.max(0,v)/mx);
  const pts=[[s,0],...logs.map(l=>[l.d,+l.v||0])];if(tk>=s&&tk<=e&&!logs.some(l=>l.d===tk))pts.push([tk,+g.current||0]);
  const line=pts.map(([k,v])=>`${X(k).toFixed(1)},${Y(v).toFixed(1)}`).join(' '),last=pts[pts.length-1];
  const exp=idealAt(g,tk),cur=+g.current||0,ahead=cur>=exp;
  return `<div class="burn"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Факт против нужного темпа">
    <line class="gl" x1="${L}" y1="${Y(tgt).toFixed(1)}" x2="${W-R}" y2="${Y(tgt).toFixed(1)}"/><line class="gl" x1="${L}" y1="${Y(0).toFixed(1)}" x2="${W-R}" y2="${Y(0).toFixed(1)}"/>
    ${compact?'':`<text class="ax" x="${L-6}" y="${(Y(tgt)+3).toFixed(1)}" text-anchor="end">${num(tgt)}</text><text class="ax" x="${L-6}" y="${(Y(0)+3).toFixed(1)}" text-anchor="end">0</text>`}
    <line class="ideal" x1="${X(s).toFixed(1)}" y1="${Y(0).toFixed(1)}" x2="${X(e).toFixed(1)}" y2="${Y(tgt).toFixed(1)}"/>
    ${tk>=s&&tk<=e?`<line class="tline" x1="${X(tk).toFixed(1)}" y1="${T}" x2="${X(tk).toFixed(1)}" y2="${(T+ch).toFixed(1)}"/>`:''}
    <polyline class="act" points="${line}"/><circle class="dot" cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="4"/>
    <text class="ax" x="${L}" y="${H-5}">${fShort(s)}</text><text class="ax" x="${W-R}" y="${H-5}" text-anchor="end">${fShort(e)}</text>
  </svg><div class="legend2"><span><i class="lg acc"></i>факт</span><span><i class="lg dash"></i>нужный темп</span><span class="${ahead?'ok':'late'}">${tk<s?'':(ahead?'идёшь с запасом':'ниже темпа на '+fVal(Math.round(exp-cur),g.unit))}</span></div></div>`;
}
function radarChart(){
  const sp=spheresSorted();if(sp.length<3)return '<p class="empty">Нужно хотя бы 3 сферы.</p>';
  const W=390,H=300,cx=195,cy=150,R=92,n=sp.length;
  const keys=Object.keys(S.weeks).filter(k=>S.weeks[k]&&S.weeks[k].scores).sort(),cur=weekKey(todayKey());
  const prevKey=keys.filter(k=>k<cur).pop(),prev=prevKey?S.weeks[prevKey].scores:null;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+R*v/10*Math.cos(a),cy+R*v/10*Math.sin(a)]};
  let g='';[2,4,6,8,10].forEach(l=>{g+=`<polygon class="rgrid" points="${sp.map((_,i)=>pt(i,l).map(x=>x.toFixed(1)).join(',')).join(' ')}"/>`});
  sp.forEach((s,i)=>{const [x,y]=pt(i,10);g+=`<line class="gl" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    const a=-Math.PI/2+i*2*Math.PI/n,lx=cx+(R+16)*Math.cos(a),ly=cy+(R+16)*Math.sin(a),anc=Math.cos(a)>0.3?'start':Math.cos(a)<-0.3?'end':'middle';
    const nm=String(s.name).split(' ')[0];g+=`<text class="rl" x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anc}">${esc(nm)} ${s.score?s.score:'—'}</text>`});
  const curPts=sp.map((s,i)=>pt(i,+s.score||0).map(x=>x.toFixed(1)).join(',')).join(' ');
  const prevPts=prev?sp.map((s,i)=>pt(i,+prev[s.id]||0).map(x=>x.toFixed(1)).join(',')).join(' '):'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Баланс сфер">${g}${prev?`<polygon class="rad-prev" points="${prevPts}"/>`:''}<polygon class="rad-cur" points="${curPts}"/></svg>
  <div class="legend2"><span><i class="lg pine"></i>сейчас</span>${prev?'<span><i class="lg dash"></i>прошлая неделя</span>':''}</div>`;
}
function weeksChart(n){
  n=Math.max(1,Math.min(n,Math.floor(diff(mondayOf(startDay()),mondayOf(todayKey()))/7)+1));
  const W=340,H=130,L=6,R=6,T=16,B=22,cw=(W-L-R)/n,ch=H-T-B,cwk=mondayOf(todayKey());let out='';
  for(let i=0;i<n;i++){const ws=addDays(cwk,-7*(n-1-i)),we=addDays(ws,6),full=daysRange(ws,we).filter(complete).length,x=L+i*cw,h=ch*full/7;
    out+=`<rect class="tr" x="${(x+3).toFixed(1)}" y="${T}" width="${(cw-6).toFixed(1)}" height="${ch}" rx="4"/>`+(full?`<rect class="bv${full===7?' full':''}" x="${(x+3).toFixed(1)}" y="${(T+ch-h).toFixed(1)}" width="${(cw-6).toFixed(1)}" height="${h.toFixed(1)}" rx="4"/>`:'')
      +`<text class="ax" x="${(x+cw/2).toFixed(1)}" y="${(T+ch-h-4).toFixed(1)}" text-anchor="middle">${full}</text><text class="ax" x="${(x+cw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${fShort(ws)}</text>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Дни без срыва по неделям">${out}</svg>`;
}
function habitStats(){
  const tk=todayKey(),from=addDays(tk,-29),sd=startDay(),days=daysRange(from<sd?sd:from,tk);
  return (cfg().promises||[]).map(p=>{let c=0,app=0;days.forEach(k=>{const d=S.days[k];if(doneOn(k,p.id))c++;if(dayReq(k,d).some(r=>r.id===p.id))app++});
    let s=0,k=tk;if(!doneOn(k,p.id))k=addDays(k,-1);while(doneOn(k,p.id)&&s<1000){s++;k=addDays(k,-1)}
    const pc=app?Math.min(1,c/app):0;
    return `<li><div class="row"><span>${esc(p.text)}</span><span>${c} из ${app} · ${pctTxt(pc)} · серия ${s}</span></div><div class="bar pine"><i style="width:${(pc*100).toFixed(1)}%"></i></div></li>`}).join('');
}

/* панель результатов недели / месяца */

/* МЕСЯЦ */
function vMonth(){
  const tk=todayKey(),mk=S.monthKey||monthOf(tk),m=S.months[mk]||{},st=monthStats(mk),cur=mk===monthOf(tk);
  const mo=+mk.slice(5),first=mk+'-01',lead=(parse(first).getDay()+6)%7,n=mDays(mk),end=mEnd(mk);
  const msByDay={};st.ms.forEach(({m:x})=>{(msByDay[x.date]=msByDay[x.date]||[]).push(x)});
  let cells=WDS.map(w=>`<span class="calh">${w}</span>`).join('');for(let i=0;i<lead;i++)cells+='<span class="cday blank"></span>';
  for(let dd=1;dd<=n;dd++){const k=`${mk}-${pad(dd)}`,s=dayStat(k),p=s.has&&s.total?s.done/s.total:0,fut=k>tk;
    cells+=`<button type="button" class="cday${k===tk?' today':''}${fut?' fut':''}${s.has&&p>=1?' full':''}${p>=0.55&&p<1?' dk':''}" style="--p:${Math.round(p*100)}%" data-act="open-day" data-k="${k}" aria-label="${dd} ${MG[mo-1]}${s.has?', '+pctTxt(p):''}"><span class="cn">${dd}</span>${msByDay[k]?'<span class="cms"></span>':''}</button>`}
  const weeks=[];let w=mondayOf(first);while(w<=end){weeks.push(w);w=addDays(w,7)}
  const prevEnd=addDays(first,-1);
  const ng=goalsSorted().filter(g=>g.kind==='number');
  const plans=ng.map(g=>{const fact=valAt(g,cur?tk:end)-valAt(g,prevEnd),plan=m.targets&&m.targets[g.id],p=plan?Math.max(0,Math.min(1,fact/plan)):0;
    const remainMonths=g.deadline&&g.deadline>=first?monthsBetween(mk,monthOf(g.deadline))+1:null;
    const sugg=remainMonths?Math.ceil(Math.max(0,(+g.target||0)-valAt(g,prevEnd))/remainMonths):null;
    return `<li><div class="row"><b>${esc(g.title)}</b><span>${fVal(Math.round(fact*10)/10,g.unit)}${plan?' из '+fVal(plan,g.unit):''}</span></div><div class="bar"><i style="width:${(p*100).toFixed(1)}%"></i></div>
      <div class="plan-row"><span class="muted small">План на месяц</span><input class="in" inputmode="decimal" id="mt-${esc(g.id)}" data-input="month-target" data-goal="${esc(g.id)}" value="${plan??''}" placeholder="${sugg!=null?'≈ '+num(sugg):''}" aria-label="План на месяц: ${esc(g.title)}">${sugg!=null&&!plan?`<span class="muted small">чтобы успеть к сроку: ≈ ${fVal(sugg,g.unit)}</span>`:''}</div></li>`}).join('');
  const tiles=[[st.past.length?st.full/st.past.length:0,'acc',`${st.full}/${st.past.length}`,'дней без срыва'],[st.avg,'pine',pctTxt(st.avg),'обещаний выполнено'],[krPct(m.krs),'sky',`${(m.krs||[]).filter(x=>x.d).length}/${(m.krs||[]).length}`,'результатов месяца'],[st.ms.length?st.msDone/st.ms.length:0,'pine',`${st.msDone}/${st.ms.length}`,'контрольных точек']];
  return `<div class="dayhead">
    <button class="icon-btn" type="button" data-act="month-prev" aria-label="Предыдущий месяц">‹</button>
    <div class="mid"><h1 class="h1">${mName(mk)}</h1><p class="sub"><span>${cur?'Текущий месяц':mk>monthOf(tk)?'Планирование':'Архив'}</span>${!cur?'<button class="btn ghost sm" type="button" data-act="month-today">К текущему</button>':''}<button class="btn ghost sm" type="button" data-view="year">Год</button></p></div>
    <button class="icon-btn" type="button" data-act="month-next" aria-label="Следующий месяц">›</button>
  </div>
  <div class="tiles">${tiles.map(([p,c,t,l])=>`<div class="tile">${ring(p,c,76,8,t)}<p>${l}</p></div>`).join('')}</div>
  <div class="grid2">
    <div class="col">
      <section class="panel"><header><span class="label">Календарь</span><span class="muted small">цвет — доля выполненных обещаний</span></header><div class="cal">${cells}</div>
        <div class="legend2"><span><i class="lg pine"></i>частично</span><span><i class="lg acc"></i>все обещания</span><span><i class="lg sky" style="border-radius:50%"></i>контрольная точка</span></div>
        <div class="weeklinks">${weeks.map(ws=>`<button class="btn sm ghost" type="button" data-act="open-week" data-k="${ws}">${fShort(ws)} — ${fShort(addDays(ws,6))}</button>`).join('')}</div></section>
      ${ng.length?`<section class="panel"><header><span class="label">Цифры месяца: план и факт</span></header><ul class="mini mplan">${plans}</ul></section>`:''}
      <section class="panel"><header><span class="label">Контрольные точки месяца</span></header>${st.ms.length?`<ul class="ms">${st.ms.map(({g,m:x})=>msRow(g,x,true,'mm')).join('')}</ul>`:'<p class="empty">В этом месяце контрольных точек нет.</p>'}</section>
    </div>
    <div class="col">
      ${krPanel('month',mk,m.krs,'Результаты месяца','3–5 измеримых результатов, которые двигают цели года. Неделя строится из них.')}
      <section class="panel review"><header><span class="label">Итоги месяца</span></header>
        <label class="field"><span>Что получилось</span><textarea class="in" id="mo-wins" data-input="month-field" data-field="wins">${esc(m.wins)}</textarea></label>
        <label class="field"><span>Что не сработало и почему</span><textarea class="in" id="mo-miss" data-input="month-field" data-field="misses">${esc(m.misses)}</textarea></label>
        <label class="field"><span>Главное на следующий месяц</span><textarea class="in" id="mo-next" data-input="month-field" data-field="next">${esc(m.next)}</textarea></label>
        ${cur?`<div style="margin-top:12px"><button class="btn sm" type="button" data-act="month-next">Спланировать ${MNOM[+addMonths(mk,1).slice(5)-1].toLowerCase()}</button></div>`:''}
      </section>
      <section class="panel"><header><span class="label">Энергия и задачи</span></header><p class="small">Средняя энергия: <b class="mono">${st.energy?st.energy.toLocaleString('ru-RU',{maximumFractionDigits:1}):'—'}</b> из 5 · задач закрыто: <b class="mono">${st.tasks}</b></p></section>
    </div>
  </div>`;
}

  <div class="seg wide tabs-row" role="group" aria-label="Раздел плана">${segBtns('plan-tab',t,[['day','День'],['week','Неделя'],['month','Месяц'],['tasks','Задачи']])}</div>
  <div class="sub-view">${body}</div>`;
}
function vPlanDay(){
  const k=S.dayKey,tk=todayKey(),isT=k===tk,d=getDay(k),ws=mondayOf(k),now=new Date(),hm=pad(now.getHours())+':'+pad(now.getMinutes());
  const dates=[0,1,2,3,4,5,6].map(i=>{const dk=addDays(ws,i);return `<button type="button" class="dsel${dk===k?' sel':''}${dk===tk?' today':''}" data-act="plan-date" data-k="${dk}" aria-pressed="${dk===k}"><span>${WDS[i]}</span><b>${parse(dk).getDate()}</b></button>`}).join('');
  const plan=dayPlan(k,S.days[k]?d:null).slice().sort((a,b)=>String(a.time).localeCompare(String(b.time)));
  let ci=-1;if(isT)plan.forEach((b,i)=>{if(b.time&&b.time<=hm)ci=i});
  const times={};plan.forEach(b=>{times[b.time]=(times[b.time]||0)+1});
  let rows='',nowPlaced=!isT;
  plan.forEach((b,i)=>{
    if(!nowPlaced&&b.time>hm){rows+=`<div class="now-line"><span>${hm}</span><i></i></div>`;nowPlaced=true}
    const nx=plan[i+1],dur=nx?durMin(b.time,nx.time):null;
    const state=b.st==='done'?'done':b.st==='skip'?'skip':times[b.time]>1?'conflict':(isT&&i===ci)?'active':(isT&&i<ci)?'past':'planned';
    const lbl={done:'Сделано',skip:'Отпущено',conflict:'Пересечение по времени',active:'Сейчас',past:'Не отмечено',planned:''}[state];
    rows+=`<div class="tl-row"><div class="tl-time"><input class="tin" type="text" inputmode="numeric" maxlength="5" placeholder="09:00" id="pt-${esc(b.id)}" data-input="plan-time" data-id="${esc(b.id)}" value="${esc(b.time)}" aria-label="Время"></div>
      <div class="blk st-${state}"><div class="blk-main"><input class="line-input blk-title" id="pn-${esc(b.id)}" data-input="plan-title" data-id="${esc(b.id)}" value="${esc(b.title)}" placeholder="Что делаю" aria-label="Блок"><span class="blk-meta">${[dur>0?dur+' мин':'',lbl].filter(Boolean).join(' · ')}</span></div>
      <span class="pl-act"><button type="button" class="pa" data-act="plan-st" data-st="done" data-id="${esc(b.id)}" aria-pressed="${b.st==='done'}" title="Сделано" aria-label="Сделано">${icon('check')}</button><button type="button" class="pa" data-act="plan-st" data-st="skip" data-id="${esc(b.id)}" aria-pressed="${b.st==='skip'}" title="Отпустил: день пошёл иначе" aria-label="Отпустил">${icon('skip')}</button><button type="button" class="pa del" data-act="plan-del" data-id="${esc(b.id)}" title="Убрать" aria-label="Убрать блок">${icon('x')}</button></span></div></div>`;
  });
  if(!nowPlaced&&plan.length)rows+=`<div class="now-line"><span>${hm}</span><i></i></div>`;
  const pDone=plan.filter(b=>b.st==='done').length,pSkip=plan.filter(b=>b.st==='skip').length;
  const due=tasksAll().filter(t=>!t.done&&t.due&&(isT?t.due<=k:t.due===k)).sort((a,b)=>a.due.localeCompare(b.due));
  const nodate=tasksAll().filter(t=>!t.done&&!t.due).slice(0,5);
  const sess=(d.focus||[]);
  return `<div class="datesel"><button class="icon-btn" type="button" data-act="plan-wk" data-d="-7" aria-label="Прошлая неделя">${icon('chevL')}</button><div class="dates">${dates}</div><button class="icon-btn" type="button" data-act="plan-wk" data-d="7" aria-label="Следующая неделя">${icon('chevR')}</button></div>
  <div class="plan-sum"><span>${WD[parse(k).getDay()]}, ${fDay(k)}${isT?' · сегодня':''}</span><span>Сделано <b>${pDone}</b></span><span>Отпущено <b>${pSkip}</b></span><span>Впереди <b>${plan.length-pDone-pSkip}</b></span>${!isT?'<button class="link" type="button" data-act="day-today">К сегодня</button>':''}</div>
  <div class="tl">${rows||'<p class="empty">План пуст. Добавь блок или верни шаблон.</p>'}</div>
  <div class="plan-tools">
    <div class="row"><button class="btn sm primary" type="button" data-act="plan-add">${icon('plus')} Блок</button><span class="faint small">Перестроить остаток дня:</span><div class="seg" role="group" aria-label="Сдвинуть оставшиеся блоки"><button type="button" data-act="plan-shift" data-m="15">+15</button><button type="button" data-act="plan-shift" data-m="30">+30</button><button type="button" data-act="plan-shift" data-m="60">+1 ч</button><button type="button" data-act="plan-shift" data-m="-15">−15</button></div></div>
    <div class="row">${S.planReset?'<span class="faint small">Вернуть шаблон и стереть правки дня?</span><button class="btn sm" type="button" data-act="plan-reset-no">Нет</button><button class="btn sm danger" type="button" data-act="plan-reset-yes">Вернуть</button>':'<button class="btn sm ghost" type="button" data-act="plan-template">Сделать шаблоном</button><button class="btn sm ghost" type="button" data-act="plan-reset">Вернуть шаблон</button>'}</div>
  </div>
  <section class="section"><div class="sec-head"><h2 class="t-sec">Без времени</h2><span class="faint small">${isT?'на сегодня и просроченные':'на этот день'}</span></div>
    <div class="card">${due.length?`<ul class="tlist">${due.map(taskRow).join('')}</ul>`:'<p class="empty">Задач с этой датой нет.</p>'}
      <form class="inline-form" data-form="task-add" style="margin-top:10px"><input class="in" name="title" id="pd-title" placeholder="Задача на этот день" aria-label="Задача"><input type="hidden" name="due" value="${k}"><select class="in" name="goal" id="pd-goal" aria-label="Цель">${goalOptions('')}</select><button class="btn" type="submit">Добавить</button></form>
      ${nodate.length?`<div class="sub-label" style="margin-top:14px"><span class="label">Без даты</span></div><ul class="tlist">${nodate.map(taskRow).join('')}</ul>`:''}</div></section>
  ${sess.length?`<section class="section"><div class="sec-head"><h2 class="t-sec">Фокус-сессии</h2></div><div class="card"><ul class="sessions">${sess.map(s=>`<li><span>${esc(s.title)}</span><span class="mono">${s.actual} мин</span></li>`).join('')}</ul></div></section>`:''}`;
}

/* ---------------- ПРОГРЕСС ---------------- */
function weekBars(days){
  const W=340,H=150,T=18,B=22,L=6,R=6,n=days.length,cw=(W-L-R)/n,ch=H-T-B,tk=todayKey();let out='';
  days.forEach((k,i)=>{const s=dayStat(k),p=s.has&&s.total?s.done/s.total:0,x=L+i*cw+cw*0.22,w=cw*0.56,h=Math.max(p?6:0,ch*p);
    out+=`<rect class="tr" x="${x.toFixed(1)}" y="${T}" width="${w.toFixed(1)}" height="${ch}" rx="7"/>`+(p?`<rect class="bv${k===tk?' full':''}" x="${x.toFixed(1)}" y="${(T+ch-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="7"/>`:'')
      +(s.has?`<text class="axv" x="${(x+w/2).toFixed(1)}" y="${(T+ch-h-5).toFixed(1)}" text-anchor="middle">${Math.round(p*100)}</text>`:'')
      +`<text class="ax" x="${(x+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${WDS[(parse(k).getDay()+6)%7]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Выполнение привычек по дням, %">${out}</svg>`;
}
function vProgress(){
  const n=S.period||7,tk=todayKey(),sd=startDay(),from=addDays(tk,-(n-1)),days=daysRange(from<sd?sd:from,tk);
  const withData=days.filter(k=>S.days[k]).length;
  let tp=0,td=0,fmins=0;const sess=[];
  days.forEach(k=>{const d=S.days[k];if(!d)return;const s=topStat(d);tp+=s.filled;td+=s.done;(d.focus||[]).forEach(x=>{fmins+=+x.actual||0;sess.push(Object.assign({day:k},x))})});
  const full=days.filter(complete).length;
  const fh=Math.floor(fmins/60),fm=fmins%60;
  const chart=withData<3?`<div class="empty-chart"><b>Пока мало данных</b><span>Тренд появится, когда будет хотя бы 3 дня с отметками. Сейчас: ${withData}.</span></div>`:n===7?weekBars(days.length<7?daysRange(addDays(tk,-6),tk):days):daysChart(tk,n);
  const prs=cfg().promises||[];
  const hc=prs.map((p,ix)=>{let c=0,app=0;days.forEach(k=>{const d=S.days[k];if(doneOn(k,p.id))c++;if(d&&dayReq(k,d).some(r=>r.id===p.id))app++;else if(!d&&k<tk)app++});const pc=app?Math.min(1,c/app):0;
    return `<div class="hcard"><div class="row"><b>${esc(p.text)}</b><span style="color:var(--${['success','focus','accent','warn'][ix%4]})">${app?pctTxt(pc):'—'}</span></div><p>${c} из ${app} запланированных ${plural(app,['дня','дней','дней'])}</p>${weekSegs(p.id,mondayOf(tk),ix)}</div>`}).join('');
  const burns=goalsSorted().filter(g=>g.kind==='number').map(g=>`<div class="burnwrap"><div class="row"><b>${esc(g.title)}</b><span class="mono small">${fVal(g.current,g.unit)} / ${fVal(g.target,g.unit)}</span></div>${burnChart(g,false)}</div>`).join('');
  sess.sort((a,b)=>String(b.start||b.day).localeCompare(String(a.start||a.day)));
  return `<header class="page-head"><div><div class="eyebrow">Прогресс</div><h1 class="t-page">Что работает</h1><p class="sub">Последние ${n} дней${days.length<n?` · данные есть с ${fShort(sd)}`:''}</p></div></header>
  <div class="seg wide tabs-row" role="group" aria-label="Период">${segBtns('period',String(n),[['7','7 дней'],['30','30 дней'],['90','90 дней']])}</div>
  <div class="metrics">
    <div class="stat"><span class="label">Опоры дня</span><div class="v">${td}<small> / ${tp}</small></div><p>выполнено главных задач</p></div>
    <div class="stat"><span class="label">Без срыва</span><div class="v">${full}<small> / ${days.length}</small></div><p>дней все привычки</p></div>
    <div class="stat"><span class="label">Глубокий фокус</span><div class="v">${fh?fh+'<small> ч </small>':''}${fm}<small> мин</small></div><p>${sess.length} ${plural(sess.length,['сессия','сессии','сессий'])}</p></div>
  </div>
  <div class="grid2"><div class="col">
    <section class="card"><div class="sec-head"><h2 class="t-sec">Привычки по дням</h2><span class="faint small">% выполненных за день</span></div>${chart}</section>
    <section><div class="sec-head"><h2 class="t-sec">Привычки</h2><span class="faint small">% от запланированных дней</span></div><div class="stack">${hc||'<p class="empty">Привычек нет.</p>'}</div><p class="faint small" style="margin-top:8px">Пропуск — повод вернуться, а не наказание.</p></section>
    <section class="card"><div class="sec-head"><h2 class="t-sec">Вывод</h2><span class="faint small">что требует внимания</span></div>${signalsHtml(signals())}</section>
  </div><div class="col">
    ${burns?`<section class="card"><div class="sec-head"><h2 class="t-sec">Цифры</h2><span class="faint small">факт против нужного темпа</span></div>${burns}</section>`:''}
    <section class="card"><div class="sec-head"><h2 class="t-sec">Баланс сфер</h2><button class="link" type="button" data-act="goto-map">Оценить</button></div>${radarChart()}</section>
    <section class="card"><div class="sec-head"><h2 class="t-sec">Фокус-сессии</h2></div>${sess.length?`<ul class="sessions">${sess.slice(0,10).map(s=>`<li><span>${esc(s.title)}<br><span class="faint small">${fShort(s.day)}</span></span><span class="mono">${s.actual} из ${s.plan} мин</span></li>`).join('')}</ul>`:'<p class="empty">Сессий пока нет. Запусти первую со страницы «Сегодня».</p>'}</section>
    ${n>7&&withData>=7?`<section class="card"><div class="sec-head"><h2 class="t-sec">Недели без срыва</h2></div>${weeksChart(Math.ceil(n/7))}</section>`:''}
  </div></div>`;
}

/* ---------------- ФОКУС-СЕССИЯ ---------------- */
const FKEY='lp_focus';
function fLoad(){try{return JSON.parse(localStorage.getItem(FKEY)||'null')}catch(e){return null}}
function fSave(v){S.focus=v;try{if(v)localStorage.setItem(FKEY,JSON.stringify(v));else localStorage.removeItem(FKEY)}catch(e){}}
function fElapsed(f){if(!f||!f.startedAt)return 0;const end=f.pausedAt||Date.now();return Math.max(0,(end-f.startedAt-(f.pausedTotal||0))/1000)}
function fmtFocus(f){const left=f.planMin*60-fElapsed(f),a=Math.abs(Math.round(left)),s=pad(Math.floor(a/60))+':'+pad(a%60);return left<0?'+'+s:s}
function renderFocus(){
  const el=$('#focus'),f=S.focus;
  if(!f||!f.open){el.hidden=true;el.innerHTML='';document.body.style.overflow='';renderMini();return}
  el.hidden=false;document.body.style.overflow='hidden';
  const top=`<div class="focus-top"><button class="btn ghost sm" type="button" data-act="${f.stage==='run'?'focus-min':'focus-cancel'}">${icon(f.stage==='run'?'down':'x')} ${f.stage==='run'?'Свернуть':'Закрыть'}</button><span class="eyebrow">Глубокий фокус</span></div>`;
  let body='';
  if(f.stage==='setup'){
    body=`<p class="focus-quote">Сейчас важно только одно.</p><h2 class="focus-title">${esc(f.title)}</h2>
      <div class="field" style="justify-items:center"><span>Сколько минут</span><div class="durs" role="group" aria-label="Длительность">${[25,40,60,90].map(m=>`<button type="button" data-act="focus-dur" data-m="${m}" aria-pressed="${f.planMin===m}">${m}</button>`).join('')}</div></div>
      <button class="btn primary big" type="button" data-act="focus-go" style="max-width:320px">${icon('play')} Начать</button>`;
  }else if(f.stage==='run'){
    const C=2*Math.PI*112,el2=fElapsed(f),p=Math.min(1,el2/(f.planMin*60)),over=el2>f.planMin*60;
    body=`<h2 class="focus-title">${esc(f.title)}</h2>
      <div class="focus-ring"><svg viewBox="0 0 240 240" aria-hidden="true"><circle class="rt" cx="120" cy="120" r="112" stroke-width="8"/><circle id="fring" class="rv${over?' over':''}" cx="120" cy="120" r="112" stroke-width="8" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 120 120)"/></svg>
        <div class="focus-time"><b id="ftime" data-ftime>${fmtFocus(f)}</b><span>${over?'сверх плана · ':''}из ${f.planMin} минут${f.pausedAt?' · пауза':''}</span></div></div>
      <p class="focus-quote">${f.pausedAt?'Пауза. Вернись, когда будешь готов.':'Один важный шаг лучше десяти незавершённых.'}</p>
      <div class="focus-btns"><button class="btn" type="button" data-act="focus-pause">${icon(f.pausedAt?'play':'pause')} ${f.pausedAt?'Продолжить':'Пауза'}</button><button class="btn primary" type="button" data-act="focus-end">Завершить</button></div>`;
  }else{
    body=`<p class="focus-quote">Сессия завершена</p><h2 class="focus-title">${esc(f.title)}</h2>
      <div class="focus-result"><b>${f.actual} мин</b><p class="muted small">фактически из ${f.planMin} запланированных</p></div>
      <div class="focus-btns" style="grid-template-columns:1fr">${(f.task||f.slot!=null)?'<button class="btn primary big" type="button" data-act="focus-taskdone">'+icon('check')+' Задача сделана</button>':''}<button class="btn big" type="button" data-act="focus-more">Ещё 15 минут</button><button class="btn ghost big" type="button" data-act="focus-close">Готово</button></div>`;
  }
  el.innerHTML=top+`<div class="focus-body">${body}</div>`;
}
function renderMini(){
  const m=$('#fmini'),f=S.focus;
  if(f&&f.stage==='run'&&!f.open){m.hidden=false;m.innerHTML=`<span>Фокус · <b data-ftime>${fmtFocus(f)}</b></span><button class="btn sm primary" type="button" data-act="focus-show">Вернуться</button>`}else{m.hidden=true;m.innerHTML=''}
}
function tickFocus(){
  const f=S.focus;if(!f||f.stage!=='run')return;
  document.querySelectorAll('[data-ftime]').forEach(e=>{e.textContent=fmtFocus(f)});
  const r=document.getElementById('fring');if(r){const C=2*Math.PI*112,el2=fElapsed(f),p=Math.min(1,el2/(f.planMin*60));r.setAttribute('stroke-dasharray',`${(C*p).toFixed(1)} ${C.toFixed(1)}`);if(el2>f.planMin*60)r.classList.add('over')}
}
setInterval(tickFocus,1000);
function focusRecord(f){
  const actual=Math.max(1,Math.round(fElapsed(f)/60)),day=f.day||todayKey();
  mutateDay(day,d=>{d.focus=[...(d.focus||[]),{id:uid(),title:f.title,task:f.task||null,start:new Date(f.startedAt).toISOString(),plan:f.planMin,actual}]});
  return actual;
}
function applyTheme(){let t='auto';try{t=localStorage.getItem('lp_theme')||'auto'}catch(e){}if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

/* действия Quiet Ambition (перехватываются раньше старых) */
function act5(n,el,e){
  const id=el.dataset.id;
  switch(n){
    case 'plan-tab':S.planTab=el.dataset.t;break;
    case 'goals-tab':S.view='goals';S.goalsTab=el.dataset.t;window.scrollTo(0,0);break;
    case 'me-tab':S.meTab=el.dataset.t;break;
    case 'period':S.period=+el.dataset.t;break;
    case 'plan-date':S.dayKey=el.dataset.k;break;
    case 'plan-wk':S.dayKey=addDays(S.dayKey,+el.dataset.d);break;
    case 'goto-plan':S.view='plan';S.planTab='day';syncHash();window.scrollTo(0,0);break;
    case 'goto-me':S.view='me';S.meTab='base';syncHash();window.scrollTo(0,0);break;
    case 'goto-goals':S.view='goals';S.goalsTab='goals';syncHash();window.scrollTo(0,0);break;
    case 'goto-map':S.view='goals';S.goalsTab='spheres';syncHash();window.scrollTo(0,0);break;
    case 'goto-goal':{S.view='goals';S.goalsTab='goals';S.horizon='all';syncHash();render();const ge=document.getElementById('goal-'+id);if(ge)ge.scrollIntoView({block:'start'});return true}
    case 'open-week':S.weekStart=mondayOf(el.dataset.k);S.view='plan';S.planTab='week';syncHash();window.scrollTo(0,0);break;
    case 'open-month':S.monthKey=el.dataset.k;S.view='plan';S.planTab='month';syncHash();window.scrollTo(0,0);break;
    case 'open-day':S.dayKey=el.dataset.k;S.view='today';syncHash();window.scrollTo(0,0);break;
    case 'top-suggest-today':S.dayKey=todayKey();S.view='today';syncHash();act('top-suggest',el,e);return true;
    case 'review-toggle':S.reviewOpen=true;break;
    case 'theme':try{localStorage.setItem('lp_theme',el.dataset.t)}catch(err){}applyTheme();break;
    case 'cfg-add':{const l=el.dataset.list;const c=Object.assign({},cfg());c[l]=[...(c[l]||[]),''];S.config=c;save('config/main',S.config,0);render();const ins=viewEl.querySelectorAll(`[data-list="${l}"][data-input]`);if(ins.length)ins[ins.length-1].focus();return true}
    case 'cfg-del':{const l=el.dataset.list,i=+el.dataset.i;const c=Object.assign({},cfg());c[l]=(c[l]||[]).filter((_,j)=>j!==i);S.config=c;save('config/main',S.config,0);break}
    case 'proud-del':{const c=Object.assign({},cfg());c.proud=(c.proud||[]).filter(p=>p.id!==id);S.config=c;save('config/main',S.config,0);break}
    case 'focus-open':{const d=getDay(S.dayKey),x=slotInfo(d)[+el.dataset.i];if(!x||!x.filled)return true;
      if(S.focus&&S.focus.stage==='run'){S.focus.open=true;fSave(S.focus);renderFocus();return true}
      fSave({open:true,stage:'setup',title:x.title,task:x.task?x.t.task:null,slot:x.task?null:x.i,day:S.dayKey,planMin:40});renderFocus();return true}
    case 'focus-show':if(S.focus){S.focus.open=true;fSave(S.focus);renderFocus()}return true;
    case 'focus-dur':S.focus.planMin=+el.dataset.m;fSave(S.focus);renderFocus();return true;
    case 'focus-go':Object.assign(S.focus,{stage:'run',startedAt:Date.now(),pausedAt:null,pausedTotal:0});fSave(S.focus);renderFocus();return true;
    case 'focus-pause':{const f=S.focus;if(f.pausedAt){f.pausedTotal=(f.pausedTotal||0)+(Date.now()-f.pausedAt);f.pausedAt=null}else f.pausedAt=Date.now();fSave(f);renderFocus();return true}
    case 'focus-min':S.focus.open=false;fSave(S.focus);renderFocus();render();return true;
    case 'focus-cancel':fSave(null);renderFocus();render();return true;
    case 'focus-end':{const f=S.focus;if(f.pausedAt){f.pausedTotal=(f.pausedTotal||0)+(Date.now()-f.pausedAt);f.pausedAt=null}f.actual=focusRecord(f);f.stage='done';f.open=true;fSave(f);renderFocus();return true}
    case 'focus-more':{const f=S.focus;fSave({open:true,stage:'run',title:f.title,task:f.task,slot:f.slot,day:f.day,planMin:15,startedAt:Date.now(),pausedAt:null,pausedTotal:0});renderFocus();return true}
    case 'focus-taskdone':{const f=S.focus;if(f.task){setTaskDone(f.task,true);syncSlots(f.task,true)}else if(f.slot!=null)mutateDay(f.day||todayKey(),d=>{if(d.top[f.slot])d.top[f.slot].d=true});fSave(null);renderFocus();toast('Отмечено. Хорошая работа.');render();return true}
    case 'focus-close':fSave(null);renderFocus();render();return true;
    default:return false;
  }
  render();return true;
}

/* ---------- modals ---------- */
function shell(id,title,body){return `<div class="backdrop" data-act="close-modal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="${id}"><header><h2 class="h2" id="${id}">${title}</h2><button class="icon-btn" type="button" data-act="close-modal" aria-label="Закрыть">×</button></header>${body}</div></div>`}
function openModal(kind,draft){S.modal=kind;S.draft=draft;renderModal(true)}
function closeModal(){modalEl.hidden=true;modalEl.innerHTML='';S.modal=null;S.draft=null}
function renderModal(focus){
  const st=modalEl.querySelector('.sheet');const top=st?st.scrollTop:0;
  modalEl.hidden=false;
  modalEl.innerHTML=S.modal==='goal'?mGoal():S.modal==='task'?mTask():S.modal==='note'?mNote():mSettings();
  modalEl.querySelectorAll('textarea').forEach(autosize);
  const ns=modalEl.querySelector('.sheet');if(ns&&!focus)ns.scrollTop=top;
  if(focus){const f=modalEl.querySelector('input:not([type=hidden]),textarea,select');if(f)f.focus({preventScroll:true})}
}
function mGoal(){
  const d=S.draft,isNew=!d.id;
  const ms=(d.milestones||[]).map((m,i)=>`<div class="srow2"><input class="in" type="date" data-sinput="milestones.${i}.date" value="${esc(m.date||'')}" aria-label="Дата этапа"><input class="in" data-sinput="milestones.${i}.title" value="${esc(m.title)}" placeholder="Этап" aria-label="Этап"><button class="x-btn" type="button" data-act="d-del" data-list="milestones" data-i="${i}" aria-label="Удалить этап">×</button></div>`).join('');
  const del=isNew?'<span></span>':(d._confirm?`<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="muted small">Удалить цель? Задачи останутся.</span><button class="btn sm" type="button" data-act="d-confirm-no">Нет</button><button class="btn sm danger" type="button" data-act="goal-delete">Удалить</button></span>`:`<button class="btn ghost sm" type="button" data-act="d-confirm">Удалить цель</button>`);
  return shell('gm-t',isNew?'Новая цель':'Цель',`<form data-form="goal-save">
    <label class="field"><span>Что именно</span><input class="in" data-sinput="title" value="${esc(d.title)}" placeholder="Например: $10 000 чистыми" required></label>
    <div class="two"><label class="field"><span>Сфера</span><select class="in" data-sinput="sphere">${sphereOptions(d.sphere,'Без сферы')}</select></label>
    <label class="field"><span>Срок</span><input class="in" type="date" data-sinput="deadline" value="${esc(d.deadline||'')}"></label></div>
    <label class="field"><span>Как меряем</span><select class="in" data-sinput="kind"><option value="number"${d.kind==='number'?' selected':''}>Числом: сумма, подписчики</option><option value="steps"${d.kind!=='number'?' selected':''}>Этапами</option></select></label>
    ${d.kind==='number'?`<div class="two"><label class="field"><span>Цель</span><input class="in" inputmode="decimal" data-sinput="target" value="${esc(d.target??'')}" placeholder="10000"></label><label class="field"><span>Единица</span><input class="in" data-sinput="unit" value="${esc(d.unit||'')}" placeholder="$, ₽, подписчиков"></label></div>
    <label class="field"><span>Сейчас</span><input class="in" inputmode="decimal" data-sinput="current" value="${esc(d.current??0)}"></label>`:''}
    <fieldset><legend>Контрольные точки</legend>${ms||'<p class="empty">Этапов нет.</p>'}<div><button class="btn sm" type="button" data-act="d-add" data-list="milestones">Добавить этап</button></div></fieldset>
    <div class="actions">${del}<div class="r"><button class="btn ghost" type="button" data-act="close-modal">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></div>
  </form>`);
}
function mNote(){
  const d=S.draft;
  return shell('nt-t','Мысль',`<form data-form="note-save">
    <textarea class="in note-big" data-sinput="text" placeholder="Пиши как есть: мысль, идею, тревогу, план. Структура потом." aria-label="Мысль">${esc(d.text||'')}</textarea>
    <div class="actions"><button class="btn ghost sm" type="button" data-act="note-to-task">Сразу в задачу</button><div class="r"><button class="btn ghost" type="button" data-act="close-modal">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></div>
    <p class="muted small">Ctrl/⌘ + Enter — сохранить. Найти потом: «Задачи» → «Мысли».</p>
  </form>`);
}
function mTask(){
  const d=S.draft,isNew=!d.id,tk=todayKey(),nm=addDays(mondayOf(tk),7);
  const chips=[['Сегодня',tk],['Завтра',addDays(tk,1)],['След. понедельник',nm],['Без срока','']].map(([l,v])=>`<button class="btn sm${(d.due||'')===v?' primary':''}" type="button" data-act="d-due" data-v="${v}">${l}</button>`).join('');
  const del=isNew?'<span></span>':(d._confirm?`<span style="display:flex;gap:8px;align-items:center"><span class="muted small">Удалить задачу?</span><button class="btn sm" type="button" data-act="d-confirm-no">Нет</button><button class="btn sm danger" type="button" data-act="task-delete">Удалить</button></span>`:`<button class="btn ghost sm" type="button" data-act="d-confirm">Удалить</button>`);
  return shell('tm-t',isNew?'Новая задача':'Задача',`<form data-form="task-save">
    <label class="field"><span>Что сделать</span><input class="in" data-sinput="title" value="${esc(d.title)}" required></label>
    <label class="field"><span>Цель, которую двигает</span><select class="in" data-sinput="goal">${goalOptions(d.goal)}</select></label>
    <label class="field"><span>Сфера</span><select class="in" data-sinput="sphere">${sphereOptions(d.sphere,'Без сферы')}</select></label>
    <div class="field"><span>Срок</span><div class="quick">${chips}</div><input class="in" type="date" data-sinput="due" value="${esc(d.due||'')}" aria-label="Дата"></div>
    <div class="actions">${del}<div class="r"><button class="btn ghost" type="button" data-act="close-modal">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></div>
  </form>`);
}
function mSettings(){
  const d=S.draft;
  const pr=(d.promises||[]).map((p,i)=>`<div class="prow"><input class="in p-text" data-sinput="promises.${i}.text" value="${esc(p.text)}" placeholder="Обещание" aria-label="Обещание ${i+1}"><input class="in p-min" data-sinput="promises.${i}.min" value="${esc(p.min)}" placeholder="В день-минимум (пусто = не входит)" aria-label="Версия для дня-минимума"><input class="in p-week" inputmode="numeric" data-sinput="promises.${i}.perWeek" value="${esc(p.perWeek??7)}" aria-label="Раз в неделю" title="Сколько раз в неделю"><button class="x-btn" type="button" data-act="d-del" data-list="promises" data-i="${i}" aria-label="Удалить">×</button></div>`).join('');
  const sc=(d.schedule||[]).map((b,i)=>`<div class="srow2"><input class="in" type="time" data-sinput="schedule.${i}.time" value="${esc(b.time)}" aria-label="Время"><input class="in" data-sinput="schedule.${i}.title" value="${esc(b.title)}" placeholder="Что делаю" aria-label="Блок"><button class="x-btn" type="button" data-act="d-del" data-list="schedule" data-i="${i}" aria-label="Удалить">×</button></div>`).join('');
  return shell('st-t','Настройки системы',`<form data-form="settings">
    <label class="field"><span>Главный фокус</span><input class="in" data-sinput="mainFocus" value="${esc(d.mainFocus)}"></label>
    <div class="two"><label class="field"><span>Фокус до</span><input class="in" type="date" data-sinput="focusUntil" value="${esc(d.focusUntil)}"></label>
    <label class="field"><span>Фраза личности</span><input class="in" data-sinput="identity" value="${esc(d.identity)}"></label></div>
    <fieldset><legend>Обещания себе</legend><p class="muted small">Текст · версия для дня-минимума · сколько раз в неделю. Изменения действуют с сегодняшнего дня, прошлые дни не пересчитываются.</p>${pr||'<p class="empty">Пока пусто.</p>'}<div><button class="btn sm" type="button" data-act="d-add" data-list="promises">Добавить обещание</button></div></fieldset>
    <fieldset><legend>Шаблон плана дня</legend><p class="muted small">С него начинается каждый новый день. Сам день правится прямо в «Сегодня».</p>${sc||'<p class="empty">Пока пусто.</p>'}<div><button class="btn sm" type="button" data-act="d-add" data-list="schedule">Добавить блок</button></div></fieldset>
    <fieldset><legend>Перенос и резервная копия</legend>
      <p class="muted small">«Скопировать данные» кладёт всё (цели, задачи, сферы, дни, недели, настройки) в буфер обмена. На другой копии сервиса вставь это в поле ниже и нажми «Загрузить».</p>
      <div><button class="btn sm" type="button" data-act="export">Скопировать данные</button></div>
      ${d._exp?`<textarea class="in mono" id="exp-text" readonly style="min-height:90px;font-size:12px">${esc(d._exp)}</textarea>`:''}

document.addEventListener('click',e=>{

    case 'promise-skip':mutateDay(S.dayKey,d=>{d.skip=Object.assign({},d.skip);if(d.skip[id])delete d.skip[id];else{d.skip[id]=true;delete d.promises[id]}});break;

      mutateDay(S.dayKey,d=>{materialize(d);d.plan.push({id:nid,time:hm,title:'',st:''})});render();{const el2=document.getElementById('pn-'+nid);if(el2)el2.focus()}return}

/* Закрыл задачу в списке — отметка в слоте «главных» сегодняшнего дня тоже меняется. */
function syncSlots(taskId,v){const k=todayKey();const d=S.days[k];if(!d||!d.top)return;const i=d.top.findIndex(t=>t.task===taskId);if(i>=0)mutateDay(k,x=>{x.top[i].d=v})}
function onInput(t){

    case 'top-text':mutateDay(S.dayKey,d=>{d.top[+t.dataset.i].t=t.value},700);break;

    case 'week-field':{const ws=S.weekStart||mondayOf(todayKey());mutate('weeks',weekKey(ws),w=>{w.start=ws;w[f]=t.value},700);break}
    case 'cfg-field':{const c=Object.assign({},cfg());c[f]=t.value;S.config=c;save('config/main',S.config,700);break}
    case 'cfg-list':{const l=t.dataset.list,i=+t.dataset.i;const c=Object.assign({},cfg());c[l]=[...(c[l]||[])];c[l][i]=t.value;S.config=c;save('config/main',S.config,700);break}
    case 'plan-time':{const m=String(t.value).trim().replace('.',':').match(/^([01]?\d|2[0-3]):([0-5]\d)$/);if(!m)break;const v=pad(+m[1])+':'+m[2];mutateDay(S.dayKey,d=>{materialize(d);const b=d.plan.find(x=>x.id===id);if(b)b.time=v},600);break}
    case 'plan-title':mutateDay(S.dayKey,d=>{materialize(d);const b=d.plan.find(x=>x.id===id);if(b)b.title=t.value},700);break;
    case 'kr-text':{const i=+t.dataset.i;mutate(t.dataset.scope==='week'?'weeks':'months',t.dataset.key,o=>{if(o.krs&&o.krs[i])o.krs[i].t=t.value},700);break}
    case 'note-text':mutate('notes',id,n=>{n.text=t.value},700);break;
    case 'note-search':{const q=t.value.trim().toLowerCase();viewEl.querySelectorAll('.note[data-text]').forEach(li=>{li.hidden=!!q&&!li.dataset.text.includes(q)});break}
    case 'month-field':{const mk=S.monthKey||monthOf(todayKey());mutate('months',mk,m=>{m[f]=t.value},700);break}

  }

      const tid=d.id||uid(),old=S.tasks[tid]||{done:false,doneAt:null,created:tk};S.tasks[tid]=Object.assign({},old,{title,goal:d.goal||null,sphere,due:d.due||null});save('tasks/'+tid,S.tasks[tid],0);if(d._note&&S.notes[d._note])mutate('notes',d._note,x=>{x.to='task'});closeModal();toast(d.id?'Сохранено':'Задача создана');break}
    case 'settings':{const d=S.draft;
      d.promises=(d.promises||[]).filter(p=>String(p.text||'').trim()).map(p=>({id:p.id||uid(),text:String(p.text).trim(),min:String(p.min||'').trim(),perWeek:Math.max(1,Math.min(7,parseInt(p.perWeek,10)||7))}));
      d.schedule=(d.schedule||[]).filter(b=>String(b.title||'').trim()).map(b=>({time:b.time||'00:00',title:String(b.title).trim()}));
      S.config=clone(d);delete S.config._exp;delete S.config._imp;delete S.config._impConfirm;save('config/main',S.config,0);
      if(S.days[todayKey()])mutateDay(todayKey(),x=>{x.req=reqFor(x.mode)});
      closeModal();toast('Сохранено');break}
  }
  render();
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
function notice(m){const n=$('#notice');if(m){n.textContent=m;n.hidden=false}else n.hidden=true}


/* ---------- собственный сервер: хранилище и вход ---------- */
function showLogin(msg){const l=$('#login');l.hidden=false;const e=$('#login-err');e.textContent=msg||'';e.hidden=!msg;const i=$('#login-pass');if(i)setTimeout(()=>i.focus(),0)}
function makeServerDb(){
  const subs=[];let last=null,timer=null,writes=0,polling=false;
  const meta={fromCache:false,hasPendingWrites:false};
  async function poll(){
    if(polling)return;polling=true;
    try{
      const s=writes;let r;
      try{r=await fetch('/api/all',{credentials:'same-origin',cache:'no-store'})}catch(e){return}
      if(r.status===401){showLogin();return}
      if(!r.ok)return;
      const j=await r.json();
      if(s!==writes){polling=false;return poll()}
      $('#login').hidden=true;
      if(last&&j.version===last.version)return;
      last=j;subs.forEach(f=>f(j.data));
    }finally{polling=false}
  }
  async function call(method,c,id,body){
    const r=await fetch(`/api/doc/${encodeURIComponent(c)}/${encodeURIComponent(id)}`,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
    if(r.status===401){showLogin('Сессия закончилась. Войди снова.');throw {code:'unavailable'}}
    if(!r.ok)throw {code:'unavailable'};
    writes++;
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
  window.addEventListener('focus',()=>poll());
  return {
    _start(){poll();clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)poll()},5000)},
    _poll:poll,
    doc(p){const [c,id]=p.split('/');return {
      set:b=>call('PUT',c,id,b),
      delete:()=>call('DELETE',c,id),
      onSnapshot(next){subs.push(data=>{const v=data[c]&&data[c][id];next({id,exists:!!v,data:()=>v,metadata:meta})});return ()=>{}}
    }},
    collection(c){return {onSnapshot(next){subs.push(data=>{const m=data[c]||{};const docs=Object.keys(m).sort().map(id=>({id,exists:true,data:()=>m[id],metadata:meta}));next({docs,size:docs.length,empty:!docs.length,metadata:meta,docChanges:()=>[]})});return ()=>{}}}}
  };
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='login-form')return;e.preventDefault();e.stopImmediatePropagation();
  const pw=$('#login-pass').value;const btn=e.target.querySelector('button');btn.disabled=true;
  try{
    const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){showLogin(j.error||'Не получилось войти');return}
    $('#login-pass').value='';$('#login').hidden=true;if(db)db._poll();
  }catch(err){showLogin('Сервер не отвечает. Проверь соединение.')}
  finally{btn.disabled=false}
},true);
/* ---------- boot ---------- */
(function(){const h=location.hash.slice(1);if(VIEWS.includes(h)||VMAP[h]){S.view=h;normView()}})();
S.focus=fLoad();applyTheme();if(S.focus&&S.focus.open)renderFocus();
render();
let lastToday=todayKey();
setInterval(()=>{const tk=todayKey();if(tk!==lastToday){if(S.dayKey===lastToday)S.dayKey=tk;lastToday=tk}if(S.view==='today'&&modalEl.hidden&&!editing())render()},60000);
(async function(){
  db=makeServerDb();
  const names=['config','spheres','goals','tasks','days','weeks','months','notes'];
  const timer=setTimeout(()=>{if(S.state==='loading')notice('Данные пока не загрузились. Проверь соединение: страница подхватит их сама.')},10000);
  const mark=(n,meta)=>{if(!meta.fromCache){S.loaded[n]=true;if(names.every(x=>S.loaded[x])&&S.state!=='ready'){S.state='ready';clearTimeout(timer);notice(null)}}};
  const onErr=e=>{clearTimeout(timer);S.state='error';notice('Не удалось загрузить данные'+(e&&e.code?' ('+e.code+')':'')+'. Обнови страницу позже.');render()};
  db.doc('config/main').onSnapshot(s=>{if(!dirty.has('config/main'))S.config=s.exists?clone(s.data()):null;mark('config',s.metadata);scheduleRender()},onErr);
  names.slice(1).forEach(c=>db.collection(c).onSnapshot(q=>{
    const m={};q.docs.forEach(d=>{m[d.id]=dirty.has(c+'/'+d.id)?S[c][d.id]:clone(d.data())});
    for(const p of dirty.keys()){const [cc,id]=p.split('/');if(cc===c&&!(id in m)&&S[c][id])m[id]=S[c][id]}
    S[c]=m;mark(c,q.metadata);scheduleRender();
  },onErr));

  db._start();
})();
})();
</script>
