</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">Погружение<small>Смысл становится действием</small></div><nav class="nav" aria-label="Основные разделы"><button data-page="today">Мой день</button><button data-page="route">Мой маршрут</button><button data-page="projects">Проекты и дела</button><button data-page="review">Обзор недели</button><button data-page="self">Моя опора</button></nav><div class="sidebar-foot">Точка А — данные, не приговор.<br>Точка Б — направление, не требование быть идеальным.<div class="connection"><i class="dot"></i><span id="sync">Подключение…</span></div></div></aside><main><div class="mobile-brand">Погружение</div><div class="topbar"><div class="areas" id="areas"></div><button class="btn quiet" data-action="new-task">+ Действие</button></div><div id="view" aria-live="polite"><div class="loading">Загружаю твой маршрут…</div></div></main></div><div class="login" id="login" hidden><form class="card" id="login-form"><div class="kicker">Личная система движения</div><h1 class="page-title">Погружение</h1><p class="muted">Твои направления, решения и ежедневные действия — в одном месте.</p><label>Пароль<input type="password" name="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">Войти</button><p class="danger small" id="login-error"></p></form></div><dialog class="sheet" id="dialog"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
(()=>{'use strict';
/* ---------- persistence ---------- */
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=x=>JSON.parse(JSON.stringify(x)),uid=()=>crypto.randomUUID(),areas={personal:'Личное',business:'Мой бизнес',work:'Работа по найму'},pages={today:'Мой день',route:'Мой маршрут',projects:'Проекты и дела',review:'Обзор недели',self:'Моя опора'};
const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,parseDate=s=>new Date(s+'T12:00:00'),addDate=(s,n)=>{const d=parseDate(s);d.setDate(d.getDate()+n);return dateKey(d)},today=()=>dateKey(),shortDate=s=>s?parseDate(s).toLocaleDateString('ru-RU',{day:'numeric',month:'short'}):'Без срока';
const weekStart=s=>{const d=parseDate(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return dateKey(d)},weekId=s=>{const d=parseDate(s);d.setDate(d.getDate()+3-(d.getDay()+6)%7);const y=d.getFullYear(),a=new Date(y,0,4,12);return y+'-W'+String(1+Math.round(((d-a)/86400000-3+(a.getDay()+6)%7)/7)).padStart(2,'0')};
let db={config:{},spheres:{},goals:{},tasks:{},days:{},weeks:{},months:{},notes:{}},page='today',area='all',day=today(),tab='projects',dialogContext={},ready=false,busy=false,lastVersion=null,toastTimer,importPlan=null,formDirty=false;
const cfg=()=>db.config.main||{},journey=()=>cfg().immersion||{},list=c=>Object.entries(db[c]||{}).map(([id,v])=>({...v,id})),goal=id=>db.goals[id],project=id=>db.spheres[id],active=c=>list(c).filter(x=>!x.archived),projects=()=>active('spheres').filter(x=>x.entity==='project');
const taskProject=t=>t.project||(project(t.sphere)?.entity==='project'?t.sphere:null),taskGoal=t=>t.goal||project(taskProject(t))?.goal||'',itemArea=x=>x.area||goal(x.goal)?.area||(cfg().journey?.goalAreas||{})[x.goal||x.id]||project(taskProject(x))?.area||'unassigned';
const matches=x=>area==='all'||itemArea(x)===area,openTasks=()=>active('tasks').filter(t=>!t.done),blocked=t=>t.status==='waiting'||(t.dependsOn&&db.tasks[t.dependsOn]&&!db.tasks[t.dependsOn].done),rank=t=>(journey().activePlanId&&t.id?.startsWith('plan-'+journey().activePlanId+'-')?70:0)+(t.due&&t.due<today()?100:0)+(t.due===today()?60:0)+(taskGoal(t)===journey().focusGoal?30:0)+(Number(t.priority)||0)*10;
const sorted=ts=>[...ts].sort((a,b)=>Number(blocked(a))-Number(blocked(b))||rank(b)-rank(a)||String(a.due||'9999').localeCompare(String(b.due||'9999'))),money=(n,u='')=>n===null||n===undefined||n===''?'Нет замера':Number(n).toLocaleString('ru-RU')+(u?' '+u:''),percentage=g=>g.kind==='number'&&g.current!==null&&g.current!==undefined&&Number(g.target)>0?Math.max(0,Math.min(100,(Number(g.current)-Number(g.baseline||0))/(Number(g.target)-Number(g.baseline||0)||1)*100)):null;

async function api(path,options={}){let r;try{r=await fetch(path,{credentials:'same-origin',cache:'no-store',...options})}catch(e){$('#sync').textContent='Нет соединения';throw Error('Нет соединения. Запись не сохранена — повтори после восстановления сети.')}if(r.status===401){$('#login').hidden=false;throw Error('Войди, чтобы продолжить. Записи в форме пока остаются на экране.')}if(!r.ok)throw Error('Сервер не сохранил запись. Повтори попытку.');return r.json()}

async function readPlan(){try{if(location.hash.startsWith('#plan=')){let raw=location.hash.slice(6);history.replaceState(null,'',location.pathname+location.search);if(raw.length>40000)throw Error('Слишком большой маршрут');const packed=raw.startsWith('z.');if(packed)raw=raw.slice(2);const bytes=Uint8Array.from(atob(raw.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));let json;if(packed){const reader=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')).getReader(),chunks=[];let size=0;for(;;){const{done,value}=await reader.read();if(done)break;size+=value.length;if(size>131072){await reader.cancel();throw Error('Слишком большой маршрут')}chunks.push(value)}json=await new Blob(chunks).text()}else json=new TextDecoder().decode(bytes);importPlan=JSON.parse(json);if(importPlan.version!==2||!/^[a-z0-9-]{1,60}$/.test(importPlan.id))throw Error('Неверный маршрут');sessionStorage.setItem('immersion-plan',JSON.stringify(importPlan))}else importPlan=JSON.parse(sessionStorage.getItem('immersion-plan')||'null')}catch(e){importPlan=null;toast('Не удалось прочитать подготовленный маршрут')}}
/* ---------- model ---------- */
/* Прошлые дни считаются по тем обещаниям, что действовали в тот день. Сегодня и будущее — по текущим. */
/* Отпущенное на день обещание не считается ни выполненным, ни сорванным. */
function button(a,t,id='',cls='quiet sm'){return `<button class="btn ${cls}" data-action="${a}" data-id="${E(id)}" type="button">${t}</button>`}

function text(n,label,value='',extra=''){return `<label ${extra}>${label}<textarea name="${n}" rows="3">${E(value)}</textarea></label>`}
function select(n,label,items,value='',blank='Не выбрано'){return `<label>${label}<select name="${n}">${blank!==null?'<option value="">'+blank+'</option>':''}${items.map(([v,t])=>`<option value="${E(v)}"${String(value)===String(v)?' selected':''}>${E(t)}</option>`).join('')}</select></label>`}
const areaSelect=a=>select('area','Направление',Object.entries(areas),a),goalSelect=(id,n='goal',label='Цель')=>select(n,label,active('goals').map(g=>[g.id,g.title]),id),empty=(s='Пока ничего нет')=>`<p class="empty">${s}</p>`;

function renderSelf(){const j=journey(),notes=active('notes').sort((a,b)=>String(b.at).localeCompare(String(a.at)));return head('Человек важнее показателей','Моя опора','Зачем я двигаюсь, как поступаю и что сохраняю по дороге.',button('setup','Настроить маршрут'))+`<div class="grid"><div class="stack"><section class="card"><div class="kicker">Моя точка Б</div><h2 style="margin-top:15px">Жизнь, которую я выбираю</h2><p class="body-copy">${E(j.vision||'Опиши обычный день через год — не только доход и работу.')}</p><div class="line"></div><h3>Зачем мне это</h3><p class="muted body-copy">${E(j.needs||cfg().why||'Потребность важна. Способ её удовлетворения можно выбирать.')}</p></section><section class="card"><h2>Мои стандарты поведения</h2>${(j.standards||[]).map((s,i)=>'<p><span class="positive">0'+(i+1)+'</span> · '+E(s)+'</p>').join('')||empty('Выбери три качества и переведи их в наблюдаемое поведение.')}<div class="line"></div><h3>База, которую сохраняю</h3><p class="muted body-copy">${E(j.care||'Сон, движение, близкие и отдых не должны ждать достижения цели.')}</p><h3>Когда трудно</h3><p class="muted body-copy">${E(j.recovery||'Пауза. Что я чувствую? Чего не хватает? Какой следующий шаг сейчас посилен?')}</p></section><section class="card"><h2>Точка А и ресурсы</h2><p class="body-copy">${E(j.baseline||'Текущие факты ещё не описаны.')}</p><p class="muted body-copy">${E(j.resources||'')}</p><h3>Обязательства и ограничения</h3><p class="muted body-copy">${E(j.obligations||'Не заданы')}</p><h3>Навык и условия повторения</h3><p class="muted body-copy">${E(j.skill||'Главный навык пока не выбран')}</p><p class="muted body-copy">${E(j.conditions||'Укажи время работы, поддержку и отвлечения, которые уберёшь.')}</p></section></div><aside class="stack"><section class="card"><div class="row between"><h2>Мысли и входящие</h2>${button('new-note','+ Запись')}</div>${notes.slice(0,12).map(n=>'<article class="week-result"><div class="hint">'+E(n.day||String(n.at||'').slice(0,10))+'</div><p class="small body-copy">'+E(n.text||'')+'</p></article>').join('')||empty('Здесь сохраняются идеи, не требующие немедленного действия.')}</section><section class="card"><h2>Сохранённое из прежней версии</h2><p class="small muted">Цели, задачи, дневники и заметки сохранены. Нераспределённым записям можно назначить направление и связи.</p><details><summary>Прежние сферы (${active('spheres').filter(s=>s.entity!=='project').length})</summary>${active('spheres').filter(s=>s.entity!=='project').map(s=>'<p><b>'+E(s.name||s.title)+'</b><br><span class="small muted">'+E(s.next||s.why||'')+'</span></p>').join('')}</details><details><summary>Прежние принципы и опоры</summary><pre class="small muted">${E([cfg().identity,...(cfg().principles||[]),...(cfg().hard||[])].filter(Boolean).join('\n'))}</pre></details>${button('export','Скачать резервную копию')}<p class="hint">Выгружаются твои данные, не пароль и не настройки сервера.</p></section></aside></div>`;}

function openSheet(title,html,context={}){dialogContext=context;formDirty=false;$('#dialog').innerHTML=`<div class="sheet-head"><h2>${title}</h2>${button('close','Закрыть')}</div>`+html;if(!$('#dialog').open)$('#dialog').showModal();$('#dialog').querySelector('input:not([type=hidden]),textarea,select')?.focus()}
function closeSheet(){if(formDirty&&!confirm('Закрыть форму без сохранения?'))return;$('#dialog').close();formDirty=false}
function taskForm(t={},context={}){openSheet(t.id?'Изменить действие':'Новое действие',`<form data-form="task"><div class="fields"><div class="field-wide">${field('title','Что сделать',t.title,'text','required maxlength="500"')}${field('expected','Какой конкретный итог должен получиться',t.expected)}</div>${areaSelect(t.area||context.area||(area!=='all'?area:''))}${goalSelect(t.goal||context.goal)}${select('project','Проект',projects().map(p=>[p.id,p.title]),taskProject(t)||context.project)}${field('owner','Ответственный',t.owner)}${field('due','Дата',t.due||context.due,'date')}${field('start','Начало',t.start,'time')}${field('minutes','Сколько минут нужно',t.minutes,'number','min="1" max="1440"')}${select('priority','Приоритет',[['3','Главное'],['2','Важно'],['1','Обычное']],t.priority||'2',null)}<div class="field-wide">${text('reason','Почему это приближает результат — гипотеза',t.reason)}${select('dependsOn','Сначала должно быть выполнено',openTasks().filter(x=>x.id!==t.id).map(x=>[x.id,x.title]),t.dependsOn)}${select('status','Состояние',[['todo','Можно делать'],['waiting','Ожидает ответа / заблокировано'],['done','Выполнено']],t.done?'done':t.status||'todo',null)}${field('blocker','Что именно блокирует',t.blocker)}</div></div><div class="form-foot"><button class="btn primary">Сохранить действие</button>${t.id?button('archive-task','В архив',t.id):''}</div></form>`,{...context,id:t.id})}
function goalForm(g={}){openSheet(g.id?'Настроить цель':'Новая цель',`<form data-form="goal">${field('title','Измеримый результат',g.title,'text','required maxlength="500"')}<div class="fields">${areaSelect(g.area||(area!=='all'?area:''))}${select('kind','Как измеряем',[['number','Числом'],['steps','Контрольными точками']],g.kind||'number',null)}${field('target','Целевое значение',g.target,'number','step="any"')}${field('unit','Единица: ₽, подписчики, кг…',g.unit)}${field('current','Фактическое значение сейчас — оставь пустым, если неизвестно',g.current,'number','step="any"')}${field('baseline','Исходный замер',g.baseline,'number','step="any"')}${field('deadline','Срок результата',g.deadline,'date')}${field('checkAt','Когда проверю способ',g.checkAt,'date')}</div>${text('why','Зачем мне это: потребность или ценность',g.why)}${text('hypothesis','Каким способом собираюсь получить результат — гипотеза',g.hypothesis)}${text('evidence','По каким данным проверю, работает ли способ',g.evidence)}${goalSelect(g.parentGoal,'parentGoal','Промежуточный рубеж другой цели')}${text('checkpoints','Контрольные точки: одна на строку',(g.milestones||[]).map(m=>m.title).join('\n'))}<button class="btn primary">Сохранить цель</button></form>`,{id:g.id})}
function projectForm(p={},context={}){openSheet(p.id?'Настроить проект':'Новый проект',`<form data-form="project">${field('title','Название проекта',p.title,'text','required maxlength="500"')}${text('outcome','Что должно быть готово по завершении',p.outcome)}<div class="fields">${areaSelect(p.area||(area!=='all'?area:''))}${goalSelect(p.goal||context.goal)}${field('owner','Кто отвечает за результат',p.owner)}${field('deadline','Срок',p.deadline,'date')}</div>${text('hypothesis','Почему этот проект должен сработать',p.hypothesis)}${text('evidence','Как проверим эффект',p.evidence)}${field('checkAt','Дата проверки',p.checkAt,'date')}<button class="btn primary">Сохранить проект</button></form>`,{id:p.id})}
const setupSteps=[['Точка Б','Какой обычный день через год я выбираю? Не откладывай жизнь до достижения цифры.'],['Точка А','Что есть сейчас, чем располагаю и что уже обязан выполнять?'],['Стандарты','Три качества → три наблюдаемых поступка. Не нужно сначала почувствовать себя другим человеком.'],['Фокус','Один главный результат периода и ближайший сдвиг недели.'],['Условия','Как повторять действия и сохранять базу, даже когда трудно?']];
function setup(){const j=journey(),i=Math.min(4,Number(j.setupStep)||0);openSheet('Настройка маршрута',`<div class="wizard-progress">${setupSteps.map((s,n)=>'<i class="'+(n<=i?'on':'')+'"></i>').join('')}</div><div class="kicker">Шаг ${i+1} из 5 · ${setupSteps[i][0]}</div><p class="muted small">${setupSteps[i][1]}</p><form data-form="setup">${i===0?text('vision','Моя точка Б через год',j.vision)+text('needs','Почему она важна: мои потребности и ценности',j.needs):i===1?text('baseline','Текущие факты, показатели и навыки',j.baseline)+text('resources','Команда, деньги, техника, поддержка, доступное время',j.resources)+text('obligations','Обязательства и ограничения',j.obligations):i===2?[0,1,2].map(n=>field('standard'+n,'Стандарт '+(n+1)+' — конкретное поведение',j.standards?.[n])).join(''):i===3?goalSelect(j.focusGoal,'focusGoal','Главная цель периода')+field('focusText','Если цели ещё нет: сформулируй главный результат',j.focusText)+text('weekFocus','Два–три результата ближайшей недели',j.weekFocus)+text('skill','Главный навык и польза, которую создаю',j.skill):text('care','Минимум здоровья, отношений и отдыха',j.care)+text('conditions','Время работы, окружение, что уберу; какую привычку укреплю',j.conditions)+text('recovery','Что сделаю в тяжёлый день, чтобы вернуться на курс',j.recovery)+field('dayHours','Реалистично доступно часов в день на все дела',j.dayHours,'number','min="1" max="16" step="0.5"')}<div class="form-foot"><button class="btn primary">${i===4?'Сохранить маршрут':'Сохранить и дальше'}</button><button class="btn quiet" name="later" value="1">Продолжить позже</button></div></form>`,{step:i})}
function previewPlan(){if(!importPlan)return;const p=importPlan;openSheet('Подготовленный маршрут',`<p class="muted">Это черновик по твоим словам, не прогноз и не обещание результата. Записи добавятся к существующим, ничего не удалится.</p><div class="stack">${(p.goals||[]).slice(0,20).map(g=>'<div class="card"><b>'+E(g.title)+'</b><div class="big-number">'+money(g.target,g.unit)+'</div><p class="muted small">'+shortDate(g.deadline)+' · точка А: '+money(g.current,g.unit)+'</p><p class="small">'+E(g.hypothesis||'Способ ещё нужно проверить')+'</p></div>').join('')}</div><h3 class="section-space">Проекты (${(p.projects||[]).length})</h3>${(p.projects||[]).slice(0,30).map(x=>'<p class="small">'+E(areas[x.area]||'')+' · '+E(x.title)+'</p>').join('')}<h3>Уже сделано и какие ресурсы есть</h3><p class="muted small body-copy">${E(p.profile?.resources)}</p><p class="muted small">Первые действия предложены как рабочий план. Сроки и ответственность можно изменить в каждом действии. Неизвестные показатели не подменяются нулями.</p><form data-form="import"><button class="btn primary">Подтверждаю — загрузить мой маршрут</button></form>`)}
/* ---------- events ---------- */
async function setMain(id){const t=db.tasks[id];if(!t||t.done)return;if(blocked(t)){toast('Сначала сними блокировку или выбери доступный шаг');return}const d=db.days[day]||{};await put('days',day,{immersion:{...(d.immersion||{}),mainTask:id},top:[{t:t.title,task:id,d:false},...(d.top||[]).slice(1)]});await put('tasks',id,{due:day});page='today';render();toast('Главное действие выбрано')}
/* Закрыл задачу в списке — отметка в слоте «главных» сегодняшнего дня тоже меняется. */
async function toggleTask(id){const t=db.tasks[id];if(!t)return;await put('tasks',id,{done:!t.done,status:!t.done?'done':'todo',doneAt:!t.done?today():null});for(const [k,d]of Object.entries(db.days)){if((d.top||[]).some(x=>x.task===id))await put('days',k,{top:d.top.map(x=>x.task===id?{...x,d:!t.done}:x)})}render()}
async function action(a,id,el){const t=db.tasks[id],g=goal(id),p=project(id);switch(a){case'reload':return load(true);case'close':return closeSheet();case'new-task':return taskForm({}, {due:day});case'edit-task':return taskForm({...t,id});case'task-for-project':return taskForm({}, {project:id,goal:p.goal,area:p.area,due:day});case'task-for-goal':return taskForm({}, {goal:id,area:g.area,due:day});case'new-goal':return goalForm();case'edit-goal':return goalForm({...g,id});case'new-project':return projectForm();case'edit-project':return projectForm({...p,id});case'project-for-goal':return projectForm({}, {goal:id});case'main-task':return setMain(id);case'toggle-task':return toggleTask(id);case'tomorrow':await put('tasks',id,{due:addDate(today(),1)});break;case'archive-task':await put('tasks',id,{archived:true});formDirty=false;$('#dialog').close();break;case'restore-task':await put('tasks',id,{archived:false});break;case'prev-day':day=addDate(day,-1);break;case'next-day':day=addDate(day,1);break;case'today':day=today();break;case'go-route':page='route';break;case'go-self':page='self';break;case'setup':return setup();case'preview-plan':return previewPlan();case'focus-goal':await saveJourney({focusGoal:id});break;case'day-mode':{const d=db.days[day]||{},j=d.immersion||{};await put('days',day,{immersion:{...j,mode:j.mode==='min'?'normal':'min'}});break}case'standard':{const j=db.days[day]?.immersion||{},i=el.dataset.index;await put('days',day,{immersion:{...j,standards:{...j.standards,[i]:!j.standards?.[i]}}});break}case'milestone':await put('goals',id,{milestones:(g.milestones||[]).map((m,i)=>i===Number(el.dataset.index)?{...m,done:!m.done}:m)});break;case'goal-fact':return openSheet('Фактический результат',`<p>${E(g.title)}</p><p class="muted small">Записывай реальное общее значение, не прибавку. Для прибыли — за тот период, который указан в цели.</p><form data-form="fact">${field('value','Общее значение ('+E(g.unit||'число')+')',g.current,'number','required step="any"')}${field('date','Дата замера',today(),'date','required')}<button class="btn primary">Записать факт</button></form>`,{id});case'new-note':return openSheet('Мысль или входящее',`<form data-form="note">${text('text','Что хочу сохранить')}<button class="btn primary">Сохранить</button></form>`);case'result-to-task':{const r=db.weeks[weekId(today())]?.immersion?.results?.[Number(id)];if(r)return taskForm({title:r.title,expected:r.title,goal:r.goal},{due:addDate(weekStart(today()),7)});return}case'export':{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pogruzhenie-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}}render()}
document.addEventListener('click',async e=>{const el=e.target.closest('button');if(!el||busy)return;try{if(el.dataset.page){page=el.dataset.page;render();window.scrollTo({top:0});return}if(el.dataset.area){area=el.dataset.area;render();return}if(el.dataset.tab){tab=el.dataset.tab;render();return}if(el.dataset.action){busy=true;await action(el.dataset.action,el.dataset.id,el)}}catch(err){toast(err.message)}finally{busy=false}});
document.addEventListener('input',e=>{const f=e.target.form;if(!f)return;if(f.closest('#dialog'))formDirty=true;else if(['day','review'].includes(f.dataset.form)){const v=Object.fromEntries(new FormData(f));if(f.dataset.form==='review')v.results=[0,1,2].map(i=>({title:v['result'+i],goal:v['goal'+i]}));journalDrafts[f.dataset.form+':'+(f.dataset.form==='day'?day:weekId(today()))]=v}});window.addEventListener('beforeunload',e=>{if(formDirty||Object.keys(journalDrafts).length){e.preventDefault();e.returnValue=''}});$('#dialog').addEventListener('cancel',e=>{if(formDirty&&!confirm('Закрыть без сохранения?'))e.preventDefault()});
async function applyPlan(){const p=importPlan;if(!p||p.version!==2||journey().appliedPlans?.includes(p.id))throw Error('Маршрут уже загружен или недоступен');if((p.goals||[]).length>20||(p.projects||[]).length>30||(p.tasks||[]).length>100)throw Error('Слишком большой маршрут');const key=(type,i)=>'plan-'+p.id+'-'+type+'-'+i;
for(const [i,g]of (p.goals||[]).entries()){const id=key('goal',i);if(!db.goals[id])await put('goals',id,{title:String(g.title||'Цель').slice(0,500),area:areas[g.area]?g.area:'business',kind:'number',target:Number(g.target)||0,unit:String(g.unit||''),current:g.current==null?null:Number(g.current),baseline:g.current==null?null:Number(g.current),deadline:g.deadline||null,checkAt:g.checkAt||null,why:g.why||'',hypothesis:g.hypothesis||'',evidence:g.evidence||'',parentGoal:Number.isInteger(g.parent)?key('goal',g.parent):null,created:today(),log:g.current==null?[]:[{d:today(),v:Number(g.current)}],milestones:[]})}
for(const [i,x]of(p.projects||[]).entries()){const id=key('project',i);if(!db.spheres[id])await put('spheres',id,{entity:'project',title:String(x.title||'Проект').slice(0,500),area:areas[x.area]?x.area:'business',goal:Number.isInteger(x.goal)?key('goal',x.goal):null,outcome:x.outcome||'',owner:x.owner||'',deadline:x.deadline||null,hypothesis:x.hypothesis||'',evidence:x.evidence||'',checkAt:x.checkAt||null,created:today()})}
for(const[i,t]of(p.tasks||[]).entries()){const id=key('task',i);if(!db.tasks[id])await put('tasks',id,{title:String(t.title||'Действие').slice(0,500),area:areas[t.area]?t.area:'business',project:Number.isInteger(t.project)?key('project',t.project):null,goal:Number.isInteger(t.goal)?key('goal',t.goal):null,expected:t.expected||'',reason:t.reason||'',owner:t.owner||'',minutes:Number(t.minutes)||null,priority:Number(t.priority)||2,due:Number.isInteger(t.offset)?addDate(today(),t.offset):null,dependsOn:Number.isInteger(t.after)?key('task',t.after):null,done:false,status:'todo',created:today()})}
const profile=p.profile||{},allowed={};for(const k of ['vision','needs','baseline','resources','obligations','skill','care','conditions','recovery','weekFocus','focusText'])if(typeof profile[k]==='string')allowed[k]=profile[k];if(Array.isArray(profile.standards))allowed.standards=profile.standards.slice(0,3).map(String);await saveJourney({...allowed,focusGoal:key('goal',0),activePlanId:p.id,setupComplete:true,setupStep:0,appliedPlans:[...(journey().appliedPlans||[]),p.id]});page='today';area='all';sessionStorage.removeItem('immersion-plan');importPlan=null;toast('Маршрут загружен. Выбери главное действие дня.')}
async function saveForm(f,submitter){const v=Object.fromEntries(new FormData(f)),id=dialogContext.id,number=n=>v[n]===''||v[n]==null?null:Number(v[n]);switch(f.dataset.form){case'task':{const title=v.title.trim();if(!title)throw Error('Напиши конкретное действие');const pr=project(v.project),gr=goal(v.goal||pr?.goal);if(v.dependsOn===id)throw Error('Задача не может зависеть от самой себя');let cursor=v.dependsOn,seen=new Set();while(cursor){if(cursor===id||seen.has(cursor))throw Error('Получается круговая зависимость');seen.add(cursor);cursor=db.tasks[cursor]?.dependsOn}await put('tasks',id||uid(),{...v,title,goal:v.goal||pr?.goal||null,project:v.project||null,area:v.area||pr?.area||gr?.area||'',minutes:number('minutes'),priority:number('priority'),done:v.status==='done',doneAt:v.status==='done'?(db.tasks[id]?.doneAt||today()):null,created:db.tasks[id]?.created||today()});break}case'goal':{if(!v.title.trim())throw Error('Укажи результат');if(v.kind==='number'&&!(number('target')>0))throw Error('Целевое значение должно быть больше нуля');if(v.parentGoal===id)throw Error('Цель не может быть собственным этапом');let parent=v.parentGoal,seen=new Set();while(parent){if(parent===id||seen.has(parent))throw Error('Получается круговая связь целей');seen.add(parent);parent=goal(parent)?.parentGoal}const old=goal(id)||{},current=number('current'),milestones=v.checkpoints.split('\n').map(s=>s.trim()).filter(Boolean).map(title=>(old.milestones||[]).find(m=>m.title===title)||{id:uid(),title,done:false});const log=current===old.current?old.log||[]:[...(old.log||[]).filter(x=>x.d!==today()),...(current===null?[]:[{d:today(),v:current}])];const{checkpoints,...fields}=v;await put('goals',id||uid(),{...fields,title:v.title.trim(),target:number('target'),current,baseline:number('baseline'),milestones,log,created:old.created||today()});break}case'project':if(!v.title.trim())throw Error('Назови проект');await put('spheres',id||uid(),{...v,title:v.title.trim(),entity:'project',created:project(id)?.created||today()});break;case'fact':{const g=goal(id),value=number('value');if(value===null||!Number.isFinite(value))throw Error('Введи фактическое число');if(v.date>today())throw Error('Факт нельзя записать будущим числом');const log=[...(g.log||[]).filter(l=>l.d!==v.date),{d:v.date,v:value}].sort((a,b)=>a.d.localeCompare(b.d));await put('goals',id,{log,current:log.at(-1).v,baseline:g.baseline??value});break}case'day':{const j=db.days[day]?.immersion||{};await put('days',day,{immersion:{...j,...v}});delete journalDrafts['day:'+day];toast('День сохранён');break}case'review':{const results=[0,1,2].map(i=>({title:v['result'+i].trim(),goal:v['goal'+i]||null})).filter(r=>r.title);await put('weeks',weekId(today()),{start:weekStart(today()),immersion:{actions:v.actions,effect:v.effect,obstacle:v.obstacle,change:v.change,care:v.care,results,savedAt:today()}});await saveJourney({weekFocus:results.map(r=>r.title).join('\n')});delete journalDrafts['review:'+weekId(today())];toast('Обзор и фокус недели сохранены');break}case'note':if(!v.text.trim())throw Error('Напиши мысль');await put('notes',uid(),{text:v.text.trim(),at:new Date().toISOString(),day:today()});break;case'setup':{const i=dialogContext.step,patch={...v};if(i===2){patch.standards=[v.standard0,v.standard1,v.standard2].filter(s=>s.trim());delete patch.standard0;delete patch.standard1;delete patch.standard2}patch.setupStep=i===4?0:i+1;if(i===4)patch.setupComplete=true;await saveJourney(patch);formDirty=false;if(i<4&&!submitter?.name){setup();return}$('#dialog').close();render();return}case'import':await applyPlan();break}formDirty=false;if(f.closest('#dialog'))$('#dialog').close();render()}
document.addEventListener('submit',async e=>{const f=e.target;if(f.id==='login-form'){e.preventDefault();if(busy)return;busy=true;const b=f.querySelector('button');b.disabled=true;try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:f.elements.password.value})});f.reset();$('#login-error').textContent='';busy=false;await load(true)}catch(err){$('#login-error').textContent=err.message}finally{busy=false;b.disabled=false}return}if(!f.dataset.form)return;e.preventDefault();if(busy)return;busy=true;const buttons=[...f.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);try{await saveForm(f,e.submitter)}catch(err){toast(err.message)}finally{busy=false;buttons.forEach(b=>b.disabled=false)}});

readPlan().then(()=>load(true));setInterval(()=>load(),7000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
