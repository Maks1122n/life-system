  return shell('st-t','Настройки системы',`<form data-form="settings">
    <label class="field"><span>Главный фокус</span><input class="in" data-sinput="mainFocus" value="${esc(d.mainFocus)}"></label>
    <div class="two"><label class="field"><span>Фокус до</span><input class="in" type="date" data-sinput="focusUntil" value="${esc(d.focusUntil)}"></label>
    <label class="field"><span>Фраза личности</span><input class="in" data-sinput="identity" value="${esc(d.identity)}"></label></div>
    <fieldset><legend>Обещания себе</legend><p class="muted small">Текст · версия для дня-минимума · сколько раз в неделю. Изменения действуют с сегодняшнего дня, прошлые дни не пересчитываются.</p>${pr||'<p class="empty">Пока пусто.</p>'}<div><button class="btn sm" type="button" data-act="d-add" data-list="promises">Добавить обещание</button></div></fieldset>
    <fieldset><legend>Шаблон плана дня</legend><p class="muted small">С него начинается каждый новый день. Сам день правится прямо в «Сегодня».</p>${sc||'<p class="empty">Пока пусто.</p>'}<div><button class="btn sm" type="button" data-act="d-add" data-list="schedule">Добавить блок</button></div></fieldset>
    <fieldset><legend>Перенос и резервная копия</legend>
      <p class="muted small">«Скопировать данные» кладёт всё (цели, задачи, сферы, дни, недели, настройки) в буфер обмена. На другой копии сервиса вставь это в поле ниже и нажми «Загрузить».</p>
      <div><button class="btn sm" type="button" data-act="export">Скопировать данные</button></div>
      ${d._exp?`<textarea class="in mono" id="exp-text" readonly style="min-height:90px;font-size:12px">${esc(d._exp)}</textarea>`:''}
      <textarea class="in mono" id="imp-text" data-sinput="_imp" placeholder="Вставь сюда скопированные данные" style="min-height:70px;font-size:12px">${esc(d._imp||'')}</textarea>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${d._impConfirm?`<span class="muted small">Записи с теми же номерами заменятся. Загрузить?</span><button class="btn sm" type="button" data-act="import-no">Нет</button><button class="btn sm primary" type="button" data-act="import-yes">Загрузить</button>`:`<button class="btn sm" type="button" data-act="import">Загрузить</button>`}</div>
    </fieldset>
    <div class="actions"><span></span><div class="r"><button class="btn ghost" type="button" data-act="close-modal">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div></div>
  </form>`);
}

/* ---------- events ---------- */
function go(v){v=ALIAS[v]||v;if(!VIEWS.includes(v))v='today';closeModal();S.view=v;try{if(location.hash!=='#'+v)history.replaceState(null,'','#'+v)}catch(e){}render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{let h=location.hash.slice(1);h=ALIAS[h]||h;if(VIEWS.includes(h)&&h!==S.view){S.view=h;render()}});
document.addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');if(v){go(v.dataset.view);return}
  const a=e.target.closest('[data-act]');if(!a||a.tagName==='INPUT')return;
  act(a.dataset.act,a,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!modalEl.hidden){closeModal();return}
  if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&e.target.tagName==='TEXTAREA'){const f=e.target.closest('form');if(f){e.preventDefault();f.requestSubmit()}return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[role=button]')){e.preventDefault();act(e.target.dataset.act,e.target,e)}
});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('input[type=checkbox][data-act]'))act(t.dataset.act,t,e)});
document.addEventListener('input',e=>{const t=e.target;if(t.tagName==='TEXTAREA')autosize(t);if(t.dataset.input)onInput(t);else if(t.dataset.sinput)onSInput(t)});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset&&f.dataset.form){e.preventDefault();onForm(f.dataset.form,f)}});

function setTaskDone(id,v){if(!S.tasks[id])return;mutate('tasks',id,t=>{t.done=v;t.doneAt=v?todayKey():null})}
function act(n,el,e){
  const id=el.dataset.id;
  switch(n){
    case 'day-prev':S.dayKey=addDays(S.dayKey,-1);break;
    case 'day-next':S.dayKey=addDays(S.dayKey,1);break;
    case 'day-today':S.dayKey=todayKey();break;
    case 'mode':mutateDay(S.dayKey,d=>{d.mode=el.dataset.mode;d.req=reqFor(d.mode)});break;
    case 'promise':mutateDay(S.dayKey,d=>{d.promises[id]=el.checked});break;
    case 'top-done':{const i=+el.dataset.i;const day=getDay(S.dayKey);const slot=day.top[i];if(slot.task)setTaskDone(slot.task,el.checked);mutateDay(S.dayKey,d=>{d.top[i].d=el.checked});break}
    case 'top-unlink':mutateDay(S.dayKey,d=>{d.top[+el.dataset.i]={t:'',d:false}});break;
    case 'top-suggest':{const day=getDay(S.dayKey);const used=new Set(day.top.map(t=>t.task).filter(Boolean));const cand=rankTasks().filter(t=>!used.has(t.id));
      if(!cand.length){toast('Открытых задач нет. Добавь их в целях.');return}
      mutateDay(S.dayKey,d=>{d.top=d.top.map(t=>(!t.task&&!String(t.t||'').trim()&&cand.length)?(c=>({t:c.title,d:false,task:c.id}))(cand.shift()):t)});break}
    case 'energy':{const v=+el.dataset.v;mutateDay(S.dayKey,d=>{d.energy=d.energy===v?null:v});break}
    case 'task-toggle':setTaskDone(id,el.checked);syncSlots(id,el.checked);break;
    case 'task-tomorrow':mutate('tasks',id,t=>{t.due=addDays(todayKey(),1)});toast('Перенесено на завтра');break;
    case 'task-edit':{const t=S.tasks[id];if(!t)return;openModal('task',Object.assign({id},clone(t)));return}
    case 'toggle-done':S.showDone=!S.showDone;break;
    case 'horizon':S.horizon=el.dataset.h;break;
    case 'goal-new':openModal('goal',{title:'',sphere:el.dataset.sphere||'',kind:'number',target:'',unit:'',current:0,deadline:`${new Date().getFullYear()}-12-31`,milestones:[]});return;
    case 'goal-edit':{const g=S.goals[id];if(!g)return;openModal('goal',Object.assign({id},clone(g)));return}
    case 'ms-toggle':mutate('goals',id,g=>{const m=(g.milestones||[]).find(x=>x.id===el.dataset.ms);if(m)m.done=el.checked});break;
    case 'sphere':S.sel=id;render();if(window.matchMedia('(max-width:900px)').matches){const p=document.getElementById('sphere-panel');if(p)p.scrollIntoView({block:'start'})}return;
    case 'sphere-mode':mutate('spheres',id,s=>{s.mode=el.dataset.mode});break;
    case 'sphere-score':mutate('spheres',id,s=>{s.score=+el.dataset.v});break;
    case 'next-to-task':{const s=S.spheres[id];const t=String(s&&s.next||'').trim();if(!t){toast('Сначала впиши шаг');return}const tid=uid();S.tasks[tid]={title:t,sphere:id,goal:null,due:todayKey(),done:false,doneAt:null,created:todayKey()};save('tasks/'+tid,S.tasks[tid],0);toast('Шаг добавлен в задачи на сегодня');break}
    case 'week-prev':S.weekStart=addDays(S.weekStart||mondayOf(todayKey()),-7);break;
    case 'week-next':S.weekStart=addDays(S.weekStart||mondayOf(todayKey()),7);window.scrollTo(0,0);break;
    case 'week-today':S.weekStart=null;break;
    case 'week-score':{const ws=S.weekStart||mondayOf(todayKey()),k=weekKey(ws),sp=el.dataset.sphere,v=+el.dataset.v;
      mutate('weeks',k,w=>{w.start=ws;w.scores=Object.assign({},w.scores,{[sp]:v})});
      if(ws===mondayOf(todayKey())&&S.spheres[sp])mutate('spheres',sp,s=>{s.score=v});break}
    case 'open-settings':openModal('settings',Object.assign(clone(cfg()),{promises:clone(cfg().promises||[]),schedule:clone(cfg().schedule||[])}));return;
    case 'close-modal':if(el.classList.contains('backdrop')&&e&&e.target!==el)return;closeModal();return;
    case 'd-add':{const l=el.dataset.list;S.draft[l]=S.draft[l]||[];S.draft[l].push(l==='promises'?{id:uid(),text:'',min:'',perWeek:7}:l==='schedule'?{time:'',title:''}:{id:uid(),date:'',title:'',done:false});renderModal();const ins=modalEl.querySelectorAll(`[data-sinput^="${l}."]`);const target=l==='promises'?ins[ins.length-3]:l==='schedule'?ins[ins.length-1]:ins[ins.length-1];if(target)target.focus();return}
    case 'd-del':S.draft[el.dataset.list].splice(+el.dataset.i,1);renderModal();return;
    case 'd-due':S.draft.due=el.dataset.v||null;renderModal();return;
    case 'd-confirm':S.draft._confirm=true;renderModal();return;
    case 'd-confirm-no':S.draft._confirm=false;renderModal();return;
    case 'goal-delete':{const gid=S.draft.id;remove('goals',gid);tasksAll().filter(t=>t.goal===gid).forEach(t=>mutate('tasks',t.id,x=>{x.goal=null}));closeModal();toast('Цель удалена');break}
    case 'task-delete':remove('tasks',S.draft.id);closeModal();toast('Задача удалена');break;
    case 'export':{
      const all={app:'zhizn-v-poryadke',v:2,exported:todayKey()};['spheres','goals','tasks','days','weeks','months','notes'].forEach(c=>{all[c]=clone(S[c])});all.config={main:clone(S.config||{})};
      const txt=JSON.stringify(all);S.draft._exp=txt;renderModal();
      const ta=document.getElementById('exp-text');
      const fallback=()=>{if(ta){ta.focus();ta.select()}toast('Выдели текст в поле и скопируй вручную')};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Скопировано: '+Math.round(txt.length/1024)+' КБ'),fallback)}catch(err){fallback()}
      return}
    case 'import':{let j;try{j=JSON.parse(S.draft._imp||'')}catch(err){toast('Это не похоже на скопированные данные');return}
      if(!j||j.app!=='zhizn-v-poryadke'){toast('Это не похоже на скопированные данные');return}
      S.draft._impConfirm=true;renderModal();return}
    case 'import-no':S.draft._impConfirm=false;renderModal();return;
    case 'import-yes':{let j;try{j=JSON.parse(S.draft._imp||'')}catch(err){return}
      let n=0;['spheres','goals','tasks','days','weeks','months','notes'].forEach(c=>{const m=j[c]||{};Object.keys(m).forEach(id=>{if(!/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id)||!m[id]||typeof m[id]!=='object')return;S[c][id]=m[id];save(c+'/'+id,m[id],0);n++})});
      if(j.config&&j.config.main&&typeof j.config.main==='object'){S.config=j.config.main;save('config/main',S.config,0);n++}
      closeModal();toast('Загружено записей: '+n);break}
    case 'open-day':S.dayKey=el.dataset.k;S.view='today';syncHash();window.scrollTo(0,0);break;
    case 'open-week':S.weekStart=mondayOf(el.dataset.k);S.view='week';syncHash();window.scrollTo(0,0);break;
    case 'open-month':S.monthKey=el.dataset.k;S.view='month';syncHash();window.scrollTo(0,0);break;
    case 'month-prev':S.monthKey=addMonths(S.monthKey||monthOf(todayKey()),-1);break;
    case 'month-next':S.monthKey=addMonths(S.monthKey||monthOf(todayKey()),1);window.scrollTo(0,0);break;
    case 'month-today':S.monthKey=null;break;
    case 'year-tab':S.yearTab=el.dataset.t;break;
    case 'goto-goals':S.view='year';S.yearTab='goals';syncHash();window.scrollTo(0,0);break;
    case 'goto-map':S.view='year';S.yearTab='map';syncHash();window.scrollTo(0,0);break;
    case 'goto-goal':{S.view='year';S.yearTab='goals';S.horizon='all';syncHash();render();const ge=document.getElementById('goal-'+id);if(ge)ge.scrollIntoView({block:'start'});return}
    case 'plan-tomorrow':S.dayKey=addDays(todayKey(),1);window.scrollTo(0,0);toast('Выбери три главные задачи на завтра');break;
    case 'top-suggest-today':S.dayKey=todayKey();S.view='today';syncHash();act('top-suggest',el,e);return;
    case 'kr-toggle':{const i=+el.dataset.i;mutate(el.dataset.scope==='week'?'weeks':'months',el.dataset.key,o=>{o.krs=o.krs||[];if(o.krs[i])o.krs[i].d=el.checked});break}
    case 'kr-del':{const i=+el.dataset.i;mutate(el.dataset.scope==='week'?'weeks':'months',el.dataset.key,o=>{o.krs=(o.krs||[]).filter((_,j)=>j!==i)});break}
    case 'promise-skip':mutateDay(S.dayKey,d=>{d.skip=Object.assign({},d.skip);if(d.skip[id])delete d.skip[id];else{d.skip[id]=true;delete d.promises[id]}});break;
    case 'top-add':mutateDay(S.dayKey,d=>{if(d.top.length<6)d.top.push({t:'',d:false})});render();{const ins=viewEl.querySelectorAll('[data-input="top-text"]');if(ins.length)ins[ins.length-1].focus()}return;
    case 'top-remove':mutateDay(S.dayKey,d=>{d.top.splice(+el.dataset.i,1)});break;
    case 'plan-st':{const st=el.dataset.st;mutateDay(S.dayKey,d=>{materialize(d);const b=d.plan.find(x=>x.id===id);if(b)b.st=b.st===st?'':st});break}
    case 'plan-del':mutateDay(S.dayKey,d=>{materialize(d);d.plan=d.plan.filter(x=>x.id!==id)});break;
    case 'plan-add':{const n=new Date(),isT=S.dayKey===todayKey(),hm=isT?pad(n.getHours())+':'+pad(Math.floor(n.getMinutes()/15)*15):'12:00',nid=uid();
      mutateDay(S.dayKey,d=>{materialize(d);d.plan.push({id:nid,time:hm,title:'',st:''})});render();{const el2=document.getElementById('pn-'+nid);if(el2)el2.focus()}return}
    case 'plan-shift':{const m=+el.dataset.m,isT=S.dayKey===todayKey(),n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes());let c=0;
      mutateDay(S.dayKey,d=>{materialize(d);d.plan.forEach(b=>{if(!b.st&&(!isT||b.time>hm)){b.time=addMin(b.time,m);c++}})});toast(c?`Сдвинуто блоков: ${c}, на ${m>0?'+':''}${m} мин`:'Впереди нет блоков для сдвига');break}
    case 'plan-template':{const pl=dayPlan(S.dayKey,S.days[S.dayKey]||null).filter(b=>String(b.title||'').trim()).slice().sort((a,b)=>String(a.time).localeCompare(String(b.time)));
      S.config=Object.assign({},cfg(),{schedule:pl.map(b=>({time:b.time||'00:00',title:String(b.title).trim()}))});save('config/main',S.config,0);toast('Этот план стал шаблоном для новых дней');break}
    case 'plan-reset':S.planReset=true;break;
    case 'plan-reset-no':S.planReset=false;break;
    case 'plan-reset-yes':S.planReset=false;mutateDay(S.dayKey,d=>{delete d.plan});toast('Шаблон возвращён');break;
    case 'note-quick':openModal('note',{text:''});return;
    case 'note-to-task':{const t=String(S.draft.text||'').trim();if(!t){toast('Сначала напиши мысль');return}const nid=createNote(t,'task');openModal('task',{title:firstLine(t),goal:'',sphere:'',due:todayKey(),_note:nid});return}
    case 'note-task':{const n=S.notes[id];if(!n)return;openModal('task',{title:firstLine(n.text),goal:'',sphere:'',due:todayKey(),_note:id});return}
    case 'note-goal':{const n=S.notes[id];if(!n)return;openModal('goal',{title:firstLine(n.text),sphere:'',kind:'steps',target:'',unit:'',current:0,deadline:`${new Date().getFullYear()}-12-31`,milestones:[],_note:id});return}
    case 'note-del':if(S.noteDel===id){remove('notes',id);S.noteDel=null;toast('Мысль удалена')}else S.noteDel=id;break;
    case 'tasks-tab':S.tasksTab=el.dataset.t;break;
    case 'sphere-add':{const nid=uid(),ord=Math.max(0,...spheresSorted().map(x=>+x.order||0))+1;S.spheres[nid]={name:'Новая сфера',order:ord,mode:'keep',score:null,target:'',next:''};save('spheres/'+nid,S.spheres[nid],0);S.sel=nid;S.view='year';S.yearTab='map';render();{const inp=document.getElementById('sp-name');if(inp){inp.focus();inp.select()}}return}
    case 'sphere-del':if(S.sphDel===id){remove('spheres',id);S.sel=null;S.sphDel=null;toast('Сфера удалена')}else S.sphDel=id;break;
    case 'sphere-del-no':S.sphDel=null;break;
    default:return;
  }
  render();
}
/* Закрыл задачу в списке — отметка в слоте «главных» сегодняшнего дня тоже меняется. */
function syncSlots(taskId,v){const k=todayKey();const d=S.days[k];if(!d||!d.top)return;const i=d.top.findIndex(t=>t.task===taskId);if(i>=0)mutateDay(k,x=>{x.top[i].d=v})}
function onInput(t){
  const id=t.dataset.id,f=t.dataset.field;
  switch(t.dataset.input){
    case 'top-text':mutateDay(S.dayKey,d=>{d.top[+t.dataset.i].t=t.value},700);break;
    case 'day-field':mutateDay(S.dayKey,d=>{d[f]=t.value},700);break;
    case 'sphere-field':mutate('spheres',id,s=>{s[f]=t.value},700);break;
    case 'week-field':{const ws=S.weekStart||mondayOf(todayKey());mutate('weeks',weekKey(ws),w=>{w.start=ws;w[f]=t.value},700);break}
    case 'plan-time':{const m=String(t.value).trim().replace('.',':').match(/^([01]?\d|2[0-3]):([0-5]\d)$/);if(!m)break;const v=pad(+m[1])+':'+m[2];mutateDay(S.dayKey,d=>{materialize(d);const b=d.plan.find(x=>x.id===id);if(b)b.time=v},600);break}
    case 'plan-title':mutateDay(S.dayKey,d=>{materialize(d);const b=d.plan.find(x=>x.id===id);if(b)b.title=t.value},700);break;
    case 'kr-text':{const i=+t.dataset.i;mutate(t.dataset.scope==='week'?'weeks':'months',t.dataset.key,o=>{if(o.krs&&o.krs[i])o.krs[i].t=t.value},700);break}
    case 'note-text':mutate('notes',id,n=>{n.text=t.value},700);break;
    case 'note-search':{const q=t.value.trim().toLowerCase();viewEl.querySelectorAll('.note[data-text]').forEach(li=>{li.hidden=!!q&&!li.dataset.text.includes(q)});break}
    case 'month-field':{const mk=S.monthKey||monthOf(todayKey());mutate('months',mk,m=>{m[f]=t.value},700);break}
    case 'month-target':{const mk=S.monthKey||monthOf(todayKey()),v=toNum(t.value),gid=t.dataset.goal;mutate('months',mk,m=>{m.targets=Object.assign({},m.targets);if(v==null)delete m.targets[gid];else m.targets[gid]=v},700);break}
  }
}
function onSInput(t){
  const p=t.dataset.sinput.split('.');let o=S.draft;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=t.value;
  if(S.modal==='goal'&&t.dataset.sinput==='kind')renderModal();
  if(S.modal==='task'&&t.dataset.sinput==='goal'&&t.value&&!S.draft.sphere){const g=S.goals[t.value];if(g&&g.sphere){S.draft.sphere=g.sphere;renderModal()}}
  if(S.modal==='task'&&t.dataset.sinput==='due')renderModal();
}
function onForm(n,f){
  const fd=new FormData(f),g=k=>String(fd.get(k)||'').trim(),tk=todayKey();
  switch(n){
    case 'note-add':{const text=String(fd.get('text')||'').trim();if(!text){toast('Пусто: напиши мысль');return}createNote(text);toast('Мысль сохранена');break}
    case 'note-save':{const text=String(S.draft.text||'').trim();if(!text){toast('Пусто: напиши мысль');return}createNote(text);closeModal();toast('Мысль сохранена');break}
    case 'kr-add':{const t=g('t');if(!t){toast('Напиши результат');return}const sc=f.dataset.scope,key=f.dataset.key;
      mutate(sc==='week'?'weeks':'months',key,o=>{o.krs=[...(o.krs||[]),{id:uid(),t,d:false}];if(sc==='week')o.start=o.start||(S.weekStart||mondayOf(todayKey()))});break}
    case 'goal-value':{const v=toNum(g('v'));if(v==null){toast('Введи число');return}
      mutate('goals',f.dataset.id,x=>{x.current=v;x.log=[...(x.log||[]).filter(l=>l.d!==tk),{d:tk,v}].sort((a,b)=>a.d.localeCompare(b.d))});toast('Записано');break}
    case 'task-add':{const title=g('title');if(!title){toast('Напиши задачу');return}
      const goal=g('goal')||null;let sphere=g('sphere')||null;if(!sphere&&goal&&S.goals[goal])sphere=S.goals[goal].sphere||null;
      const id=uid();S.tasks[id]={title,sphere,goal,due:g('due')||null,done:false,doneAt:null,created:tk};save('tasks/'+id,S.tasks[id],0);break}
    case 'goal-save':{const d=S.draft;const title=String(d.title||'').trim();if(!title){toast('Напиши, что за цель');return}
      const id=d.id||uid(),old=S.goals[id]||{};
      const goal={title,sphere:d.sphere||null,kind:d.kind==='number'?'number':'steps',deadline:d.deadline||null,order:old.order??(Object.keys(S.goals).length+1),created:old.created||tk,log:old.log||[],
        milestones:(d.milestones||[]).filter(m=>String(m.title||'').trim()).map(m=>({id:m.id||uid(),date:m.date||null,title:String(m.title).trim(),done:!!m.done}))};
      if(goal.kind==='number'){goal.target=toNum(d.target)||0;goal.unit=String(d.unit||'').trim();const cur=toNum(d.current)??0;goal.current=cur;
        if(old.current!==cur&&d.id)goal.log=[...goal.log.filter(l=>l.d!==tk),{d:tk,v:cur}].sort((a,b)=>a.d.localeCompare(b.d))}
      S.goals[id]=goal;save('goals/'+id,goal,0);if(d._note&&S.notes[d._note])mutate('notes',d._note,x=>{x.to='goal'});closeModal();if(!d.id){S.view='year';S.yearTab='goals';S.horizon='all';syncHash()}toast('Сохранено');break}
    case 'task-save':{const d=S.draft;const title=String(d.title||'').trim();if(!title){toast('Напиши задачу');return}
      let sphere=d.sphere||null;if(!sphere&&d.goal&&S.goals[d.goal])sphere=S.goals[d.goal].sphere||null;
      const tid=d.id||uid(),old=S.tasks[tid]||{done:false,doneAt:null,created:tk};S.tasks[tid]=Object.assign({},old,{title,goal:d.goal||null,sphere,due:d.due||null});save('tasks/'+tid,S.tasks[tid],0);if(d._note&&S.notes[d._note])mutate('notes',d._note,x=>{x.to='task'});closeModal();toast(d.id?'Сохранено':'Задача создана');break}
    case 'settings':{const d=S.draft;
      d.promises=(d.promises||[]).filter(p=>String(p.text||'').trim()).map(p=>({id:p.id||uid(),text:String(p.text).trim(),min:String(p.min||'').trim(),perWeek:Math.max(1,Math.min(7,parseInt(p.perWeek,10)||7))}));
      d.schedule=(d.schedule||[]).filter(b=>String(b.title||'').trim()).map(b=>({time:b.time||'00:00',title:String(b.title).trim()}));
      S.config=clone(d);delete S.config._exp;delete S.config._imp;delete S.config._impConfirm;save('config/main',S.config,0);
      if(S.days[todayKey()])mutateDay(todayKey(),x=>{x.req=reqFor(x.mode)});
      closeModal();toast('Сохранено');break}
  }
  render();
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
function notice(m){const n=$('#notice');if(m){n.textContent=m;n.hidden=false}else n.hidden=true}


/* ---------- собственный сервер: хранилище и вход ---------- */
function showLogin(msg){const l=$('#login');l.hidden=false;const e=$('#login-err');e.textContent=msg||'';e.hidden=!msg;const i=$('#login-pass');if(i)setTimeout(()=>i.focus(),0)}
function makeServerDb(){
  const subs=[];let last=null,timer=null,writes=0,polling=false;
  const meta={fromCache:false,hasPendingWrites:false};
  async function poll(){
    if(polling)return;polling=true;
    try{
      const s=writes;let r;
      try{r=await fetch('/api/all',{credentials:'same-origin',cache:'no-store'})}catch(e){return}
      if(r.status===401){showLogin();return}
      if(!r.ok)return;
      const j=await r.json();
      if(s!==writes){polling=false;return poll()}
      $('#login').hidden=true;
      if(last&&j.version===last.version)return;
      last=j;subs.forEach(f=>f(j.data));
    }finally{polling=false}
  }
  async function call(method,c,id,body){
    const r=await fetch(`/api/doc/${encodeURIComponent(c)}/${encodeURIComponent(id)}`,{method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
    if(r.status===401){showLogin('Сессия закончилась. Войди снова.');throw {code:'unavailable'}}
    if(!r.ok)throw {code:'unavailable'};
    writes++;
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
  window.addEventListener('focus',()=>poll());
  return {
    _start(){poll();clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)poll()},5000)},
    _poll:poll,
    doc(p){const [c,id]=p.split('/');return {
      set:b=>call('PUT',c,id,b),
      delete:()=>call('DELETE',c,id),
      onSnapshot(next){subs.push(data=>{const v=data[c]&&data[c][id];next({id,exists:!!v,data:()=>v,metadata:meta})});return ()=>{}}
    }},
    collection(c){return {onSnapshot(next){subs.push(data=>{const m=data[c]||{};const docs=Object.keys(m).sort().map(id=>({id,exists:true,data:()=>m[id],metadata:meta}));next({docs,size:docs.length,empty:!docs.length,metadata:meta,docChanges:()=>[]})});return ()=>{}}}}
  };
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='login-form')return;e.preventDefault();e.stopImmediatePropagation();
  const pw=$('#login-pass').value;const btn=e.target.querySelector('button');btn.disabled=true;
  try{
    const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){showLogin(j.error||'Не получилось войти');return}
    $('#login-pass').value='';$('#login').hidden=true;if(db)db._poll();
  }catch(err){showLogin('Сервер не отвечает. Проверь соединение.')}
  finally{btn.disabled=false}
},true);
/* ---------- boot ---------- */
(function(){let h=location.hash.slice(1);if(h==='goals')S.yearTab='goals';h=ALIAS[h]||h;if(VIEWS.includes(h))S.view=h})();
render();
let lastToday=todayKey();
setInterval(()=>{const tk=todayKey();if(tk!==lastToday){if(S.dayKey===lastToday)S.dayKey=tk;lastToday=tk}if(S.view==='today'&&modalEl.hidden&&!editing())render()},60000);
(async function(){
  db=makeServerDb();
  const names=['config','spheres','goals','tasks','days','weeks','months','notes'];
  const timer=setTimeout(()=>{if(S.state==='loading')notice('Данные пока не загрузились. Проверь соединение: страница подхватит их сама.')},10000);
  const mark=(n,meta)=>{if(!meta.fromCache){S.loaded[n]=true;if(names.every(x=>S.loaded[x])&&S.state!=='ready'){S.state='ready';clearTimeout(timer);notice(null)}}};
  const onErr=e=>{clearTimeout(timer);S.state='error';notice('Не удалось загрузить данные'+(e&&e.code?' ('+e.code+')':'')+'. Обнови страницу позже.');render()};
  db.doc('config/main').onSnapshot(s=>{if(!dirty.has('config/main'))S.config=s.exists?clone(s.data()):null;mark('config',s.metadata);scheduleRender()},onErr);
  names.slice(1).forEach(c=>db.collection(c).onSnapshot(q=>{
    const m={};q.docs.forEach(d=>{m[d.id]=dirty.has(c+'/'+d.id)?S[c][d.id]:clone(d.data())});
    for(const p of dirty.keys()){const [cc,id]=p.split('/');if(cc===c&&!(id in m)&&S[c][id])m[id]=S[c][id]}
    S[c]=m;mark(c,q.metadata);scheduleRender();
  },onErr));

  db._start();
})();
})();
</script>
